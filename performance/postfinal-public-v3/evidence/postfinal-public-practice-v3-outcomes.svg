<title id="public-chart-title">Every expanded public win, uncertain case, and slowdown</title>
<desc id="public-chart-description">Public development only; final independent benchmark failed; no final winner. CPython, C, Rust, and Zig ran the same 4096 calibration-only public cases, 13 paired trials, and 2000 bootstrap draws. All 4,096 cases per candidate; measured and confidence-supported outcomes remain separate. Public manifest SHA-256 5f49f255271b8f71786e7fa67a61827b53c1330e1ad7afe29c8750991df4b90f; public summary SHA-256 a5c5b3ad70c8fcb1df81da63ab30e727793e8a98c04c0889ca27ae9dce808bfc. Final speed, final memory, and final candidate ranking: NOT MEASURED. Final winner: NONE.</desc>
