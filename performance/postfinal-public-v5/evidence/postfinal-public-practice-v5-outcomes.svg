<title id="public-chart-title">Every expanded public win, uncertain case, and slowdown</title>
<desc id="public-chart-description">Public development only; final independent benchmark failed; no final winner. CPython, C, Rust, and Zig ran the same 8192 calibration-only public cases, 13 paired trials, and 2000 bootstrap draws. All 8,192 cases per candidate; measured and confidence-supported outcomes remain separate. Public manifest SHA-256 c9950c87079ccc1909ba4470ed573b08afe1f275b85a8932cbfe83b547b24f96; public summary SHA-256 d9dd1e712a97d0d1716308e1e468e0c9d2b6d6058e501bccd871492bc66a6b4c. Final speed, final memory, and final candidate ranking: NOT MEASURED. Final winner: NONE.</desc>
