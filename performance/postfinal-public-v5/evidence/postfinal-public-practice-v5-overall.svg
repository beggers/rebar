<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="625" viewBox="0 0 1640 625" role="img" aria-labelledby="public-chart-title public-chart-description">
<title id="public-chart-title">Expanded public development speed compared with CPython</title>
<desc id="public-chart-description">Public development only; final independent benchmark failed; no final winner. CPython, C, Rust, and Zig ran the same 8192 calibration-only public cases, 13 paired trials, and 2000 bootstrap draws. All four engines; 8,192 shared public cases; measured 95% confidence ranges. Public manifest SHA-256 c9950c87079ccc1909ba4470ed573b08afe1f275b85a8932cbfe83b547b24f96; public summary SHA-256 d9dd1e712a97d0d1716308e1e468e0c9d2b6d6058e501bccd871492bc66a6b4c. Final speed, final memory, and final candidate ranking: NOT MEASURED. Final winner: NONE.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.title{font-size:31px;font-weight:760}.subtitle{font-size:16px;fill:#475569}.heading{font-size:19px;font-weight:730}.label{font-size:14px}.value{font-size:15px;font-weight:720}.note{font-size:13.5px;fill:#475569}.tick{font-size:13px;fill:#475569}.banner{font-size:16px;font-weight:740;fill:#7f1d1d}.status{font-size:14px;font-weight:680;fill:#7f1d1d}.grid{stroke:#e2e8f0;stroke-width:1}.baseline{stroke:#64748b;stroke-width:2}.panel{fill:#f8fafc;stroke:#d9e2ee;stroke-width:1}</style>
