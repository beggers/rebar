<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1745" viewBox="0 0 1640 1745" role="img" aria-labelledby="public-chart-title public-chart-description">
<title id="public-chart-title">Measured Python-traced expanded public allocations</title>
<desc id="public-chart-description">Public development only; final independent benchmark failed; no final winner. CPython, C, Rust, and Zig ran the same 4096 calibration-only public cases, 13 paired trials, and 2000 bootstrap draws. Python-traced temporary allocations only; final, native, and whole-process memory are NOT MEASURED. Public manifest SHA-256 2228e444ae142494def731d8b94ba5fcf08c69aa8a7e04cc1c47cbebeb149b4a; public summary SHA-256 5f9a7bc81e751c9881ca521213c527ea2cfb5adcd48f02e207576f2cdd6b3386. Final speed, final memory, and final candidate ranking: NOT MEASURED. Final winner: NONE.</desc>
