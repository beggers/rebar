<title id="public-chart-title">Every expanded public win, uncertain case, and slowdown</title>
<desc id="public-chart-description">Public development only; final independent benchmark failed; no final winner. CPython, C, Rust, and Zig ran the same 4096 calibration-only public cases, 13 paired trials, and 2000 bootstrap draws. All 4,096 cases per candidate; measured and confidence-supported outcomes remain separate. Public manifest SHA-256 2228e444ae142494def731d8b94ba5fcf08c69aa8a7e04cc1c47cbebeb149b4a; public summary SHA-256 5f9a7bc81e751c9881ca521213c527ea2cfb5adcd48f02e207576f2cdd6b3386. Final speed, final memory, and final candidate ranking: NOT MEASURED. Final winner: NONE.</desc>
