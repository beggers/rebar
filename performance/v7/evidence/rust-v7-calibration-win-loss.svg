<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="503" viewBox="0 0 1250 503" role="img" aria-label="How often does Rust win or lose?">
<title>How often does Rust win or lose?</title>
<desc>PRACTICE ONLY. 624 practice tasks and 7 paired runs. The unseen test has not been opened. All 624 practice tasks; confidence-based outcomes and all more-than-20% slowdowns are shown separately</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.title{font-size:25px;font-weight:750}.sub{font-size:13px;fill:#52627a}.head{font-size:15px;font-weight:700}.label{font-size:12px}.small{font-size:11px;fill:#52627a}.value{font-size:12px;font-weight:700}.tick{font-size:10.5px;fill:#64748b}.banner{font-size:12px;font-weight:700;fill:#92400e}.grid{stroke:#e2e8f0;stroke-width:1}.base{stroke:#475569;stroke-width:1.7}.panel{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1}</style>
<text x="26" y="39" class="title">How often does Rust win or lose?</text>
<text x="26" y="63" class="sub">All 624 practice tasks; confidence-based outcomes and all more-than-20% slowdowns are shown separately</text>
<rect x="20" y="78" width="1210" height="34" rx="7" fill="#fffbeb" stroke="#fcd34d"/>
<text x="33" y="100" class="banner">PRACTICE ONLY — the final unseen test has not been opened</text>
<rect x="18" y="131" width="1214" height="145" rx="9" class="panel"/>
<text x="29" y="154" class="head">Corrected Rust baseline</text>
<text x="29" y="194" class="label">Confidence-based outcome</text>
<rect x="300.00" y="177" width="298.40" height="22" fill="#047857"/>
<text x="449.20" y="192" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#ffffff">245</text>
<rect x="598.40" y="177" width="141.28" height="22" fill="#64748b"/>
<text x="669.04" y="192" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#ffffff">116</text>
<rect x="739.68" y="177" width="320.32" height="22" fill="#dc2626"/>
<text x="899.84" y="192" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#ffffff">263</text>
<text x="1072" y="193" class="value">624/624</text>
<text x="300" y="219" class="small">245/624 clearly faster · 116/624 no clear difference · 263/624 clearly slower</text>
<text x="29" y="252" class="label">Took &gt;20% longer</text>
<rect x="300" y="236" width="760" height="19" fill="#fee2e2"/>
<rect x="300" y="236" width="213.14" height="19" fill="#dc2626"/>
<text x="1072" y="251" class="value">175/624</text>
<text x="300" y="274" class="small">A separate timing rule: all 175 large slowdowns are retained, even if an individual confidence range crosses 1×.</text>
<rect x="18" y="286" width="1214" height="145" rx="9" class="panel"/>
<text x="29" y="309" class="head">Rust: corrected v4 match combined</text>
<text x="29" y="349" class="label">Confidence-based outcome</text>
<rect x="300.00" y="332" width="306.92" height="22" fill="#047857"/>
<text x="453.46" y="347" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#ffffff">252</text>
<rect x="606.92" y="332" width="121.79" height="22" fill="#64748b"/>
<text x="667.82" y="347" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#ffffff">100</text>
<rect x="728.72" y="332" width="331.28" height="22" fill="#dc2626"/>
<text x="894.36" y="347" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#ffffff">272</text>
<text x="1072" y="348" class="value">624/624</text>
<text x="300" y="374" class="small">252/624 clearly faster · 100/624 no clear difference · 272/624 clearly slower</text>
<text x="29" y="407" class="label">Took &gt;20% longer</text>
<rect x="300" y="391" width="760" height="19" fill="#fee2e2"/>
<rect x="300" y="391" width="209.49" height="19" fill="#dc2626"/>
<text x="1072" y="406" class="value">172/624</text>
<text x="300" y="429" class="small">A separate timing rule: all 172 large slowdowns are retained, even if an individual confidence range crosses 1×.</text>
<text x="26" y="488" class="small">Green, grey, and red outcomes add to all 624 tasks. The slowdown bar uses the same 624-task denominator.</text>
</svg>
