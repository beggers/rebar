<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="548" viewBox="0 0 1320 548" role="img" aria-label="Overall practice results at a glance">
<title>Overall practice results at a glance</title>
<desc>PRACTICE ONLY. Every replacement and standard Python ran the same 624 public practice tasks in the same 7 paired trials. The unseen final test remains sealed. Ordered by the measured 624-case average; each confidence range compares only with Python</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.title{font-size:25px;font-weight:750}.sub{font-size:13px;fill:#52627a}.head{font-size:15px;font-weight:700}.label{font-size:12px}.small{font-size:11px;fill:#52627a}.value{font-size:12px;font-weight:700}.tick{font-size:10.5px;fill:#64748b}.banner{font-size:12px;font-weight:700;fill:#92400e}.grid{stroke:#e2e8f0;stroke-width:1}.base{stroke:#475569;stroke-width:1.7}.panel{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1}</style>
<text x="26" y="39" class="title">Overall practice results at a glance</text>
<text x="26" y="63" class="sub">Ordered by the measured 624-case average; each confidence range compares only with Python</text>
<rect x="20" y="78" width="1280" height="34" rx="7" fill="#fffbeb" stroke="#fcd34d"/>
<text x="33" y="100" class="banner">PRACTICE ONLY — the unseen final test remains sealed; final speed NOT MEASURED</text>
<line x1="250.00" y1="183" x2="250.00" y2="447" class="grid"/>
<text x="250.00" y="175" text-anchor="middle" class="tick">0.75×</text>
<line x1="455.86" y1="183" x2="455.86" y2="447" class="base"/>
<text x="455.86" y="175" text-anchor="middle" class="tick">1× Python</text>
<line x1="746.00" y1="183" x2="746.00" y2="447" class="grid"/>
<text x="746.00" y="175" text-anchor="middle" class="tick">1.5×</text>
<text x="768" y="174" class="small">Overall speed and 95% range</text>
<text x="1062" y="174" class="small">Clear wins</text>
<text x="1176" y="174" class="small">&gt;20% slower</text>
<text x="28" y="219" class="head">1. C</text>
<line x1="626.21" y1="215" x2="681.56" y2="215" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
<circle cx="652.09" cy="215" r="5.5" fill="#2563eb" stroke="#ffffff" stroke-width="1"/>
<text x="768" y="219" class="value">1.316× [1.269×–1.371×]</text>
<text x="1062" y="219" class="value">428/624</text>
<text x="1176" y="219" class="value">49/624</text>
<text x="28" y="290" class="head">2. Rust</text>
<line x1="517.35" y1="286" x2="576.35" y2="286" stroke="#c2410c" stroke-width="6" stroke-linecap="round"/>
<circle cx="547.22" cy="286" r="5.5" fill="#c2410c" stroke="#ffffff" stroke-width="1"/>
<text x="768" y="290" class="value">1.136× [1.090×–1.183×]</text>
<text x="1062" y="290" class="value">252/624</text>
<text x="1176" y="290" class="value">112/624</text>
<text x="28" y="361" class="head">3. Zig</text>
<line x1="424.76" y1="357" x2="490.51" y2="357" stroke="#7c3aed" stroke-width="6" stroke-linecap="round"/>
<circle cx="458.32" cy="357" r="5.5" fill="#7c3aed" stroke="#ffffff" stroke-width="1"/>
<text x="768" y="361" class="value">1.003× [0.957×–1.050×]</text>
<text x="1062" y="361" class="value">230/624</text>
<text x="1176" y="361" class="value">240/624</text>
<text x="768" y="377" class="small">Range crosses 1×: no clear overall advantage.</text>
<text x="28" y="432" class="head">Standard Python</text>
<circle cx="455.86" cy="428" r="5.5" fill="#64748b"/>
<text x="768" y="432" class="value">Exactly 1.000× baseline · 624 identical tasks</text>
<text x="26" y="514" class="small">Ordering describes practice estimates only; it does not prove a statistically significant difference between replacements.</text>
<text x="26" y="533" class="small">The unseen final test remains sealed. Final speed and the final winner: NOT MEASURED.</text>
</svg>
