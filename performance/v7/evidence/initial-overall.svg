<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="406" viewBox="0 0 1220 406" role="img" aria-label="How fast are the replacement engines?"><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#172033}.title{font-size:24px;font-weight:700}.sub{font-size:13px;fill:#52627a}.head{font-size:16px;font-weight:700}.label{font-size:12px}.small{font-size:11px;fill:#52627a}.value{font-size:12px;font-weight:700}.tick{font-size:11px;fill:#64748b}.grid{stroke:#dde5ed;stroke-width:1}.base{stroke:#64748b;stroke-width:1.4}</style><text x="24" y="38" class="title">How fast are the replacement engines?</text><text x="24" y="61" class="sub">10,312 unseen tasks. 1× is Python re; farther right is faster. Lines show the measured 95% range.</text><line x1="285.0" y1="100" x2="285.0" y2="382" class="grid"/><text x="285.0" y="94" class="tick" text-anchor="middle">.01×</text><line x1="369.3" y1="100" x2="369.3" y2="382" class="grid"/><text x="369.3" y="94" class="tick" text-anchor="middle">.03×</text><line x1="461.7" y1="100" x2="461.7" y2="382" class="grid"/><text x="461.7" y="94" class="tick" text-anchor="middle">.1×</text><line x1="546.0" y1="100" x2="546.0" y2="382" class="grid"/><text x="546.0" y="94" class="tick" text-anchor="middle">.3×</text><line x1="638.3" y1="100" x2="638.3" y2="382" class="base"/><text x="638.3" y="94" class="tick" text-anchor="middle">1× Python re</text><line x1="722.6" y1="100" x2="722.6" y2="382" class="grid"/><text x="722.6" y="94" class="tick" text-anchor="middle">3×</text><line x1="815.0" y1="100" x2="815.0" y2="382" class="grid"/><text x="815.0" y="94" class="tick" text-anchor="middle">10×</text><text x="24" y="137" class="head">Zig / rebar</text><line x1="674.8" y1="132" x2="674.9" y2="132" stroke="#059669" stroke-width="7" stroke-linecap="round"/><circle cx="674.8" cy="132" r="6" fill="#059669" stroke="#fff" stroke-width="1.5"/><text x="845" y="128" class="head">1.61× as fast overall</text><text x="845" y="148" class="small">8,868/10,312 clearly faster · 105 large slowdowns</text><text x="24" y="201" class="head">Native C engine</text><line x1="656.7" y1="196" x2="656.8" y2="196" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/><circle cx="656.7" cy="196" r="6" fill="#2563eb" stroke="#fff" stroke-width="1.5"/><text x="845" y="192" class="head">1.27× as fast overall</text><text x="845" y="212" class="small">7,369/10,312 clearly faster · 1,116 large slowdowns</text><text x="24" y="265" class="head">Rust engine</text><line x1="632.3" y1="260" x2="632.4" y2="260" stroke="#7c3aed" stroke-width="7" stroke-linecap="round"/><circle cx="632.4" cy="260" r="6" fill="#7c3aed" stroke="#fff" stroke-width="1.5"/><text x="845" y="256" class="head">0.93× as fast overall</text><text x="845" y="276" class="small">3,623/10,312 clearly faster · 3,905 large slowdowns</text><text x="24" y="329" class="head">Python engine</text><line x1="346.0" y1="324" x2="346.1" y2="324" stroke="#b45309" stroke-width="7" stroke-linecap="round"/><circle cx="346.1" cy="324" r="6" fill="#b45309" stroke="#fff" stroke-width="1.5"/><text x="845" y="320" class="head">0.022× as fast overall</text><text x="845" y="340" class="small">271/10,312 clearly faster · 9,884 large slowdowns</text></svg>
