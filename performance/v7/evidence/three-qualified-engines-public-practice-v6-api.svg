<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="715" viewBox="0 0 1320 715" role="img" aria-label="Which everyday matching tasks are faster or slower?">
<title>Which everyday matching tasks are faster or slower?</title>
<desc>PRACTICE ONLY. Every replacement and standard Python ran the same 624 public practice tasks in the same 7 paired trials. The unseen final test remains sealed. All 12 public operations; dots are measured group averages, not group confidence ranges</desc>
