<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1454" viewBox="0 0 1320 1454" role="img" aria-label="Python-visible temporary allocations">
<title>Python-visible temporary allocations</title>
<desc>PRACTICE ONLY. Every replacement and standard Python ran the same 624 public practice tasks in the same 7 paired trials. The unseen final test remains sealed. Median Python-traced temporary allocation versus Python · all 624 tasks per engine · lower is better</desc>
