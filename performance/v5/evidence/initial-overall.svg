<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="408" viewBox="0 0 1140 408" role="img" aria-label="Overall speed compared with Python re"><rect width="100%" height="100%" fill="#f8fafc"/><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#172033}.title{font-size:23px;font-weight:700}.sub{font-size:13px;fill:#526076}.head{font-size:15px;font-weight:700}.label{font-size:12px}.small{font-size:11px;fill:#526076}.value{font-size:12px;font-weight:700}</style><text x="28" y="38" class="title">Overall speed compared with Python re</text><text x="28" y="61" class="sub">3,144 holdout tasks. 1× is the built-in re module; farther right is faster. Lines show the measured 95% range.</text><line x1="270" y1="104" x2="270" y2="384" stroke="#cbd5e1" stroke-width="1"/><text x="270" y="96" class="small" text-anchor="middle">0.0001×</text><line x1="363" y1="104" x2="363" y2="384" stroke="#cbd5e1" stroke-width="1"/><text x="363" y="96" class="small" text-anchor="middle">0.001×</text><line x1="457" y1="104" x2="457" y2="384" stroke="#cbd5e1" stroke-width="1"/><text x="457" y="96" class="small" text-anchor="middle">0.01×</text><line x1="550" y1="104" x2="550" y2="384" stroke="#cbd5e1" stroke-width="1"/><text x="550" y="96" class="small" text-anchor="middle">0.1×</text><line x1="643" y1="104" x2="643" y2="384" stroke="#334155" stroke-width="2"/><text x="643" y="96" class="small" text-anchor="middle">1× baseline</text><line x1="737" y1="104" x2="737" y2="384" stroke="#cbd5e1" stroke-width="1"/><text x="737" y="96" class="small" text-anchor="middle">10×</text><line x1="830" y1="104" x2="830" y2="384" stroke="#cbd5e1" stroke-width="1"/><text x="830" y="96" class="small" text-anchor="middle">100×</text><text x="28" y="139" class="head">Native C engine</text><line x1="655" y1="134" x2="656" y2="134" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/><circle cx="656" cy="134" r="6" fill="#0284c7" stroke="#fff" stroke-width="1.5"/><text x="856" y="130" class="head">1.35× as fast overall</text><text x="856" y="150" class="small">2,482/3,144 clearly faster · 226/3,144 large slowdowns</text><text x="28" y="205" class="head">Zig engine</text><line x1="614" y1="200" x2="614" y2="200" stroke="#0f766e" stroke-width="6" stroke-linecap="round"/><circle cx="614" cy="200" r="6" fill="#0f766e" stroke="#fff" stroke-width="1.5"/><text x="856" y="196" class="head">0.48× as fast overall</text><text x="856" y="216" class="small">370/3,144 clearly faster · 2,486/3,144 large slowdowns</text><text x="28" y="271" class="head">Rust engine</text><line x1="566" y1="266" x2="566" y2="266" stroke="#d97706" stroke-width="6" stroke-linecap="round"/><circle cx="566" cy="266" r="6" fill="#d97706" stroke="#fff" stroke-width="1.5"/><text x="856" y="262" class="head">0.15× as fast overall</text><text x="856" y="282" class="small">167/3,144 clearly faster · 2,948/3,144 large slowdowns</text><text x="28" y="337" class="head">Python engine</text><line x1="492" y1="332" x2="492" y2="332" stroke="#7c3aed" stroke-width="6" stroke-linecap="round"/><circle cx="492" cy="332" r="6" fill="#7c3aed" stroke="#fff" stroke-width="1.5"/><text x="856" y="328" class="head">0.024× as fast overall</text><text x="856" y="348" class="small">86/3,144 clearly faster · 3,021/3,144 large slowdowns</text></svg>
