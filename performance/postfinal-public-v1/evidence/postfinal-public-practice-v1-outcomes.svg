<title id="public-chart-title">Every expanded public win, uncertain case, and slowdown</title>
<desc id="public-chart-description">Public development only; final independent benchmark failed; no final winner. CPython, C, Rust, and Zig ran the same 4096 calibration-only public cases, 13 paired trials, and 2000 bootstrap draws. All 4,096 cases per candidate; measured and confidence-supported outcomes remain separate. Public manifest SHA-256 4b541eaa1602855aeb67655c8732635d4c951a61ca2fae37f395a1b080a78d1e; public summary SHA-256 2f478bd2bbca7af5c635d9d40ba8ffa41a13f7a0ab92b2ab09d1bf3d2eed32a8. Final speed, final memory, and final candidate ranking: NOT MEASURED. Final winner: NONE.</desc>
