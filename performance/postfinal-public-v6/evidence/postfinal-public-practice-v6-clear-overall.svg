<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="clear-v6-overall-title clear-v6-overall-description">
<title id="clear-v6-overall-title">How fast are the current regex engines?</title>
<desc id="clear-v6-overall-description">Measured overall speed relative to Python, with independently replayed 95 percent confidence intervals for all three current engines. Public benchmark only; fresh final test unopened; no final winner.</desc>
<style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#17263b}.eyebrow{font-size:12px;font-weight:720;letter-spacing:1.7px;fill:#58718c}.title{font-size:32px;font-weight:760;letter-spacing:-.8px}.subtitle{font-size:14px;fill:#607087}.heading{font-size:17px;font-weight:720}.body{font-size:13px;fill:#46586d}.label{font-size:15px;font-weight:690}.value{font-size:15px;font-weight:730}.big{font-size:32px;font-weight:760;letter-spacing:-.6px}.small{font-size:11.5px;fill:#65768a}.tick{font-size:11px;fill:#718299}.footer{font-size:12px;font-weight:620;fill:#58718c}</style>
<rect x="0.00" y="0.00" width="1120.00" height="650.00" rx="0.00" fill="#f5f7fb"/>
<rect x="24.00" y="20.00" width="1072.00" height="610.00" rx="20.00" fill="#ffffff"/>
<text x="56.00" y="57.00" class="eyebrow">INDEPENDENTLY VERIFIED · CURRENT PUBLIC BENCHMARK</text>
<text x="54.00" y="101.00" class="title">How fast are the current regex engines?</text>
<text x="56.00" y="126.00" class="subtitle">Higher is faster. The 1× line is standard Python; bars show measured uncertainty.</text>
<rect x="56.00" y="151.00" width="174.00" height="62.00" rx="12.00" fill="#f5f8fc"/>
<text x="70.00" y="174.00" class="small">Shared public cases</text>
<text x="70.00" y="198.00" class="value">8,192 per engine</text>
<rect x="242.00" y="151.00" width="174.00" height="62.00" rx="12.00" fill="#f5f8fc"/>
<text x="256.00" y="174.00" class="small">Workload coverage</text>
<text x="256.00" y="198.00" class="value">12 APIs · 260 groups</text>
<rect x="428.00" y="151.00" width="190.00" height="62.00" rx="12.00" fill="#f5f8fc"/>
<text x="442.00" y="174.00" class="small">Uncertainty</text>
<text x="442.00" y="198.00" class="value">95% bootstrap interval</text>
<line x1="283.22" y1="279.00" x2="283.22" y2="486.00" stroke="#e9edf3" stroke-width="1.00" stroke-dasharray="0"/>
<text x="283.22" y="503.00" class="tick" text-anchor="middle">0.75×</text>
<line x1="482.06" y1="279.00" x2="482.06" y2="486.00" stroke="#7d8fa3" stroke-width="1.60" stroke-dasharray="0"/>
<text x="482.06" y="503.00" class="tick" text-anchor="middle">1×</text>
<line x1="636.30" y1="279.00" x2="636.30" y2="486.00" stroke="#e9edf3" stroke-width="1.00" stroke-dasharray="0"/>
<text x="636.30" y="503.00" class="tick" text-anchor="middle">1.25×</text>
<line x1="762.32" y1="279.00" x2="762.32" y2="486.00" stroke="#8a72bb" stroke-width="1.60" stroke-dasharray="5 5"/>
<text x="762.32" y="503.00" class="tick" text-anchor="middle">1.5×</text>
<text x="482.06" y="269.00" class="small" text-anchor="middle">Python · 1×</text>
<text x="762.32" y="269.00" class="small" text-anchor="middle">1.5× target</text>
<text x="66.00" y="324.00" class="label">Zig</text>
<line x1="609.41" y1="319.00" x2="622.87" y2="319.00" stroke="#7766c9" stroke-width="5.00" stroke-linecap="round"/>
<line x1="609.41" y1="311.00" x2="609.41" y2="327.00" stroke="#7766c9" stroke-width="2.00"/>
<line x1="622.87" y1="311.00" x2="622.87" y2="327.00" stroke="#7766c9" stroke-width="2.00"/>
<circle cx="615.96" cy="319.00" r="7" fill="#7766c9" stroke="#ffffff" stroke-width="2"/>
<text x="851.00" y="316.00" class="value">1.214×</text>
<text x="851.00" y="336.00" class="small">1.202–1.226× · 95% CI</text>
<text x="66.00" y="392.00" class="label">C</text>
<line x1="556.69" y1="387.00" x2="569.40" y2="387.00" stroke="#238b86" stroke-width="5.00" stroke-linecap="round"/>
<line x1="556.69" y1="379.00" x2="556.69" y2="395.00" stroke="#238b86" stroke-width="2.00"/>
<line x1="569.40" y1="379.00" x2="569.40" y2="395.00" stroke="#238b86" stroke-width="2.00"/>
<circle cx="563.00" cy="387.00" r="7" fill="#238b86" stroke="#ffffff" stroke-width="2"/>
<text x="851.00" y="384.00" class="value">1.124×</text>
<text x="851.00" y="404.00" class="small">1.114–1.135× · 95% CI</text>
<text x="66.00" y="460.00" class="label">Rust</text>
<line x1="444.89" y1="455.00" x2="459.09" y2="455.00" stroke="#d17852" stroke-width="5.00" stroke-linecap="round"/>
<line x1="444.89" y1="447.00" x2="444.89" y2="463.00" stroke="#d17852" stroke-width="2.00"/>
<line x1="459.09" y1="447.00" x2="459.09" y2="463.00" stroke="#d17852" stroke-width="2.00"/>
<circle cx="451.79" cy="455.00" r="7" fill="#d17852" stroke="#ffffff" stroke-width="2"/>
<text x="851.00" y="452.00" class="value">0.957×</text>
<text x="851.00" y="472.00" class="small">0.948–0.967× · 95% CI</text>
<text x="58.00" y="553.00" class="heading">No engine reaches the 1.5× public speed target.</text>
<text x="58.00" y="574.00" class="body">This public comparison does not qualify a final winner.</text>
<line x1="56.00" y1="584.00" x2="1064.00" y2="584.00" stroke="#e6ebf2" stroke-width="1.00"/>
<text x="56.00" y="611.00" class="footer">Public benchmark only; fresh final test unopened; no final winner.</text>
<text x="1064.00" y="611.00" class="small" text-anchor="end">8,192 public cases · 13 paired trials</text>
</svg>
