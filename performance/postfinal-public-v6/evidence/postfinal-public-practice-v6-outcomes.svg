<title id="public-chart-title">Every expanded public win, uncertain case, and slowdown</title>
<desc id="public-chart-description">Public development only; final independent benchmark failed; no final winner. CPython, C, Rust, and Zig ran the same 8192 calibration-only public cases, 13 paired trials, and 2000 bootstrap draws. All 8,192 cases per candidate; measured and confidence-supported outcomes remain separate. Public manifest SHA-256 65e024a1a79d13b03e4e5ad0f3d4ae010dbb6e4f09b52a8542837a2ea4c6198a; public summary SHA-256 539fe6ba0ac492ffab121845da21033676ad7e7154ce9107f7f1778f55ceed4c. Final speed, final memory, and final candidate ranking: NOT MEASURED. Final winner: NONE.</desc>
