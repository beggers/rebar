<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="370" viewBox="0 0 1240 370" role="img" aria-label="At a glance: speed compared with Python re">
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="28" y="34" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">At a glance: speed compared with Python re</text>
<text x="28" y="59" font-family="Arial, sans-serif" font-size="13" fill="#475569">New holdout tasks. 1× is the built-in re module; higher is faster. The line shows the measured range.</text>
