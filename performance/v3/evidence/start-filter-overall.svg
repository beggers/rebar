<text x="357" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">0.001×</text>
<line x1="443" y1="91" x2="443" y2="346" stroke="#cbd5e1" stroke-width="1"/>
<text x="443" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">0.01×</text>
<line x1="530" y1="91" x2="530" y2="346" stroke="#cbd5e1" stroke-width="1"/>
<text x="530" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">0.1×</text>
<line x1="617" y1="91" x2="617" y2="346" stroke="#334155" stroke-width="2"/>
<text x="617" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">1× Python re</text>
<line x1="703" y1="91" x2="703" y2="346" stroke="#cbd5e1" stroke-width="1"/>
<text x="703" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">10×</text>
<line x1="790" y1="91" x2="790" y2="346" stroke="#cbd5e1" stroke-width="1"/>
<text x="790" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">100×</text>
<text x="28" y="129" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Native C engine</text>
<line x1="620" y1="125" x2="620" y2="125" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
<circle cx="620" cy="125" r="7" fill="#0284c7" stroke="#fff" stroke-width="1.5"/>
<text x="820" y="120" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">1.10× as fast overall</text>
<text x="820" y="141" font-family="Arial, sans-serif" font-size="12" fill="#475569">37/72 clearly faster · 12/72 large slowdowns · range 1.09×–1.10×</text>
<text x="28" y="211" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Rust engine</text>
<line x1="455" y1="207" x2="455" y2="207" stroke="#d97706" stroke-width="6" stroke-linecap="round"/>
<circle cx="455" cy="207" r="7" fill="#d97706" stroke="#fff" stroke-width="1.5"/>
<text x="820" y="202" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">0.014× as fast overall</text>
<text x="820" y="223" font-family="Arial, sans-serif" font-size="12" fill="#475569">2/72 clearly faster · 69/72 large slowdowns · range 0.014×–0.014×</text>
