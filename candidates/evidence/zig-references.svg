/text><line x1="780.1" y1="158" x2="781.3" y2="158" stroke="#238b64" stroke-width="5" stroke-linecap="round"/><circle cx="780.7" cy="158" r="7" fill="#238b64"/><text x="828" y="163" class="num">3.858× (3.837–3.878)</text><text x="275" y="218" text-anchor="end" class="label">Search captured alternatives (absent)</text><line x1="602.2" y1="213" x2="615.5" y2="213" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/><circle cx="607.9" cy="213" r="7" fill="#7c3aed"/><text x="828" y="218" class="num">0.835× (0.794–0.893)</text><text x="275" y="273" text-anchor="end" class="label">Check repeated captured fields</text><line x1="758.8" y1="268" x2="760.6" y2="268" stroke="#238b64" stroke-width="5" stroke-linecap="round"/><circle cx="759.8" cy="268" r="7" fill="#238b64"/><text x="828" y="273" class="num">3.206× (3.176–3.229)</text><text x="275" y="328" text-anchor="end" class="label">Find a captured address</text><line x1="730.3" y1="323" x2="732.5" y2="323" stroke="#238b64" stroke-width="5" stroke-linecap="round"/><circle cx="731.6" cy="323" r="7" fill="#238b64"/><text x="828" y="328" class="num">2.496× (2.469–2.517)</text><text x="275" y="383" text-anchor="end" class="label">Find captured line fields</text><line x1="748.8" y1="378" x2="749.3" y2="378" stroke="#238b64" stroke-width="5" stroke-linecap="round"/><circle cx="749.1" cy="378" r="7" fill="#238b64"/><text x="828" y="383" class="num">2.915× (2.909–2.922)</text><text x="275" y="438" text-anchor="end" class="label">Find a repeated captured word</text><line x1="690.2" y1="433" x2="691.8" y2="433" stroke="#238b64" stroke-width="5" stroke-linecap="round"/><circle cx="691.1" cy="433" r="7" fill="#238b64"/><text x="828" y="438" class="num">1.744× (1.731–1.756)</text><text x="275" y="493" text-anchor="end" class="label">Find a conditional captured field</text><line x1="794.3" y1="488" x2="803.7" y2="488" stroke="#238b64" stroke-width="5" stroke-linecap="round"/><circle cx="799.6" cy="488" r="7" fill="#238b64"/><text x