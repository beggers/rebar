<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-label="Zig compatibility and speed progress"><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#172033}.title{font-size:23px;font-weight:700}.sub{font-size:13px;fill:#536179}.section{font-size:15px;font-weight:700}.label{font-size:13px}.value{font-size:12px;text-anchor:end;font-weight:700}.note{font-size:12px;fill:#536179}.track{fill:#e9edf3}</style><text x="26" y="38" class="title">Zig: compatibility and speed so far</text><text x="26" y="61" class="sub">The engine is written from scratch. It is improving, but it is not yet a drop-in replacement for Python re.</text><text x="26" y="99" class="section">How much works?</text><text x="26" y="135" class="label">Initial compatibility check</text><rect x="340" y="120" width="480" height="22" rx="3" class="track"/><rect x="340" y="120" width="62" height="22" rx="3" fill="#c84c4c"/><text x="972" y="135" class="value">1,058/8,244 passed</text><text x="26" y="170" class="label">Current compatibility check</text><rect x="340" y="155" width="480" height="22" rx="3" class="track"/><rect x="340" y="155" width="154" height="22" rx="3" fill="#c84c4c"/><text x="972" y="170" class="value">2,651/8,244 passed</text><text x="26" y="205" class="label">Initial broader task check</text><rect x="340" y="190" width="480" height="22" rx="3" class="track"/><rect x="340" y="190" width="393" height="22" rx="3" fill="#d48a2b"/><text x="972" y="205" class="value">118/144 passed</text><text x="26" y="240" class="label">Current broader task check</text><rect x="340" y="225" width="480" height="22" rx="3" class="track"/><rect x="340" y="225" width="447" height="22" rx="3" fill="#d48a2b"/><text x="972" y="240" class="value">134/144 passed</text><text x="26" y="275" class="label">Official CPython re tests</text><rect x="340" y="260" width="480" height="22" rx="3" class="track"/><rect x="340" y="260" width="283" height="22" rx="3" fill="#d48a2b"/><text x="972" y="275" class="value">85/144 passed</text><text x="26" y="326" class="section">How fast is the public API?</text><text x="26" y="347" class="note">Short tuning check: the same 67 supported holdout tasks, five paired trials, up to eight calls each. 1× is Python re.</text><text x="26" y="380" class="label">Initial public API</text><rect x="340" y="366" width="480" height="20" rx="3" class="track"/><rect x="340" y="366" width="117" height="20" rx="3" fill="#477db7"/><text x="972" y="380" class="value">0.244× of Python re</text><text x="26" y="411" class="label">Batch matching</text><rect x="340" y="397" width="480" height="20" rx="3" class="track"/><rect x="340" y="397" width="179" height="20" rx="3" fill="#477db7"/><text x="972" y="411" class="value">0.372× of Python re</text><text x="26" y="442" class="label">Build results natively</text><rect x="340" y="428" width="480" height="20" rx="3" class="track"/><rect x="340" y="428" width="225" height="20" rx="3" fill="#477db7"/><text x="972" y="442" class="value">0.468× of Python re</text><text x="26" y="473" class="label">Batch iterators</text><rect x="340" y="459" width="480" height="20" rx="3" class="track"/><rect x="340" y="459" width="236" height="20" rx="3" fill="#477db7"/><text x="972" y="473" class="value">0.492× of Python re</text><text x="26" y="522" class="section">Full holdout check: 0.460× (0.459–0.462×)</text><text x="26" y="544" class="note">13 paired trials at full call counts · 67/72 tasks supported · 4 clearly faster · 59 more than 20% slower.</text></svg>
