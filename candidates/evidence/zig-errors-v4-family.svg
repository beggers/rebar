<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1102" viewBox="0 0 1180 1102"><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#172033}.title{font-size:23px;font-weight:700}.sub{font-size:14px;fill:#52627a}.head{font-size:11px;font-weight:700;fill:#41506a}.label{font-size:12px}.number{font-size:12px;text-anchor:end;font-variant-numeric:tabular-nums}.strong{font-size:12px;text-anchor:end;font-weight:700}.grid{stroke:#dbe1eb;stroke-width:1}</style><text x="24" y="38" class="title">How the Zig experiment compares with Python re</text><text x="24" y="64" class="sub">Overall on 1,224 unseen tasks: 0.467× as fast (0.452–0.483× measured range) · 108 clearly faster · 971 large slowdowns</text><text x="24" y="87" class="sub">Rows show the 36 balanced task families (1,152 tasks); the other 72 varied tasks are retained in the detailed graphs and raw results. Every timed result was checked.</text><text x="24" y="121" class="head">KIND OF TASK</text><text x="610" y="121" class="head" text-anchor="end">TASKS</text><text x="735" y="121" class="head" text-anchor="end">SPEED · 95% RANGE</text><text x="866" y="121" class="head" text-anchor="middle">SLOWER ← 1× → FASTER</text><line x1="866" y1="139" x2="866" y2="1080" stroke="#7f8fa7" stroke-width="1.3"/><rect x="16" y="148" width="1148" height="25" fill="#f5f7fb"/><line x1="16" y1="173" x2="1164" y2="173" class="grid"/><text x="24" y="164" class="label">Compile a new expression</text><text x="610" y="164" class="number">32</text><text x="735" y="164" class="strong" fill="#238b64">1.755× · 1.744–1.767×</text><rect x="866.0" y="153" width="82.2" height="12" rx="2.5" fill="#238b64"/><line x1="16" y1="198" x2="1164" y2="198" class="grid"/><text x="24" y="189" class="label">Cleanup</text><text x="610" y="189" class="number">32</text><text x="735" y="189" class="strong" fill="#238b64">1.228× · 1.150–1.313×</text><rect x="866.0" y="178" width="30.0" height="1