<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="404" viewBox="0 0 1180 404"><rect width="100%" height="100%" fill="#ffffff"/><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#172033}.title{font-size:24px;font-weight:700}.sub{font-size:14px;fill:#52627a}.head{font-size:16px;font-weight:700}.small{font-size:13px;fill:#52627a}.tick{font-size:12px;fill:#64748b}.grid{stroke:#dbe2ea;stroke-width:1}.base{stroke:#64748b;stroke-width:1.4}</style><text x="24" y="38" class="title">How fast are the replacement engines?</text><text x="24" y="64" class="sub">3,144 unseen tasks. 1× is Python re; farther right is faster. Lines show the measured 95% range.</text><text x="24" y="86" class="sub">Zig is the latest paired rerun; the other engines use the identical frozen protocol and their preserved paired results.</text><line x1="300.0" y1="116" x2="300.0" y2="380" class="grid"/><text x="300.0" y="108" class="tick" text-anchor="middle">.01×</text><line x1="379.5" y1="116" x2="379.5" y2="380" class="grid"/><text x="379.5" y="108" class="tick" text-anchor="middle">.03×</text><line x1="466.7" y1="116" x2="466.7" y2="380" class="grid"/><text x="466.7" y="108" class="tick" text-anchor="middle">.1×</text><line x1="546.2" y1="116" x2="546.2" y2="380" class="grid"/><text x="546.2" y="108" class="tick" text-anchor="middle">.3×</text><line x1="633.3" y1="116" x2="633.3" y2="380" class="base"/><text x="633.3" y="108" class="tick" text-anchor="middle">1× Python re</text><line x1="712.9" y1="116" x2="712.9" y2="380" class="grid"/><text x="712.9" y="108" class="tick" text-anchor="middle">3×</text><line x1="800.0" y1="116" x2="800.0" y2="380" class="grid"/><text x="800.0" y="108" class="tick" text-anchor="middle">10×</text><text x="24" y="160" class="head">Zig / rebar (winner)</text><line x1="663.5" y1="155" x2="665.6" y2="155" stroke="#059669" stroke-width="7" stroke-linecap="round"/><circle cx="664.5" cy="155" r="6" fill="#059669" stroke="#fff" stroke-width="1.5"/><text x="830" y="151" class="head">1.539× as fast overall</text><text x="830" y="172" class="small">2,635/3,144 clearly faster · 93 large slowdowns</text><text x="24" y="222" class="head">Native C engine</text><line x1="655.0" y1="217" x2="655.2" y2="217" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/><circle cx="655.1" cy="217" r="6" fill="#2563eb" stroke="#fff" stroke-width="1.5"/><text x="830" y="213" class="head">1.351× as fast overall</text><text x="830" y="234" class="small">2,482/3,144 clearly faster · 226 large slowdowns</text><text x="24" y="284" class="head">Rust engine</text><line x1="495.6" y1="279" x2="495.7" y2="279" stroke="#7c3aed" stroke-width="7" stroke-linecap="round"/><circle cx="495.6" cy="279" r="6" fill="#7c3aed" stroke="#fff" stroke-width="1.5"/><text x="830" y="275" class="head">0.149× as fast overall</text><text x="830" y="296" class="small">167/3,144 clearly faster · 2,948 large slowdowns</text><text x="24" y="346" class="head">Python engine</text><line x1="363.6" y1="341" x2="363.7" y2="341" stroke="#b45309" stroke-width="7" stroke-linecap="round"/><circle cx="363.6" cy="341" r="6" fill="#b45309" stroke="#fff" stroke-width="1.5"/><text x="830" y="337" class="head">0.024× as fast overall</text><text x="830" y="358" class="small">86/3,144 clearly faster · 3,021 large slowdowns</text></svg>
