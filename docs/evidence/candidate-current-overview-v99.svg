<text x="53" y="812" fill="#cbd5e1" font-size="12" font-family="system-ui,sans-serif">Actual C12 candidate status: FAIL; 12 completed suites; 13 distinct workers; 1 execution failure.</text>
<text x="53" y="836" fill="#cbd5e1" font-size="12" font-family="system-ui,sans-serif">All 606 observed mismatch records and all 21 chunks are preserved; total mismatch count is NOT MEASURED.</text>
<text x="53" y="860" fill="#cbd5e1" font-size="12" font-family="system-ui,sans-serif">Original source counts remain distinct: 165 source methods; 152 public records; 151 executed cases.</text>
<text x="53" y="884" fill="#cbd5e1" font-size="12" font-family="system-ui,sans-serif">Earlier C11: 16,262 verified checks. Current C12: 16,413 verified checks (+151).</text>
<text x="53" y="908" fill="#cbd5e1" font-size="12" font-family="system-ui,sans-serif">Holdout: NOT FROZEN, NOT GENERATED, NOT OPENED. Speed and memory: NOT MEASURED.</text>
<text x="53" y="932" fill="#cbd5e1" font-size="12" font-family="system-ui,sans-serif">No fully compatible candidate; runtime independence not established; no winner.</text>
