<text x="50" y="68" fill="#f8fafc" font-size="32" font-family="system-ui,sans-serif" font-weight="740">Building a faster Python re, from scratch</text>
<text x="51" y="105" fill="#cbd5e1" font-size="17" font-family="system-ui,sans-serif">C improved by 151 original checks; compatibility is incomplete; speed is not measured</text>
<rect x="46" y="129" width="1348" height="76" rx="12" fill="#172338"/>
<text x="67" y="159" fill="#f8fafc" font-size="16" font-family="system-ui,sans-serif" font-weight="680">Bars show verified original correctness checks, not speed.</text>
<text x="67" y="185" fill="#cbd5e1" font-size="14" font-family="system-ui,sans-serif">The fixed denominator is 31,237; supplemental checks are separate.</text>
