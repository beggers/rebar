<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="970" viewBox="0 0 1440 970" role="img" aria-labelledby="title description">
<title id="title">Original Python regular-expression correctness; speed not measured</title>
<desc id="description">C failed after verifying 16,413 of 31,237 original checks, an increase of 151. Twelve of thirteen suites completed using thirteen distinct workers. All 606 observed mismatch records are preserved in 21 chunks. Rust verified 14,725 checks and Zig verified 4,607 checks. These bars measure correctness, never speed. Performance, memory, and holdout are not measured; no candidate qualifies and no winner is selected.</desc>
