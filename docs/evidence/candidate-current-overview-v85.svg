<text x="175" y="189" fill="#cbd5e1" font-size="14" font-family="system-ui,sans-serif">12,942 verified checks; 8 of 13 groups completed</text>
<text x="1208" y="189" text-anchor="end" fill="#fb7185" font-size="13" font-family="system-ui,sans-serif" font-weight="700">5 GROUPS FAILED</text>
<circle cx="43" cy="231" r="6" fill="#f59e0b"/>
<text x="62" y="236" fill="#f8fafc" font-size="16" font-family="system-ui,sans-serif" font-weight="650">C</text>
<text x="175" y="236" fill="#cbd5e1" font-size="14" font-family="system-ui,sans-serif">1,230 previously observed differences</text>
<text x="1208" y="236" text-anchor="end" fill="#f59e0b" font-size="13" font-family="system-ui,sans-serif" font-weight="700">NOT COMPATIBLE</text>
