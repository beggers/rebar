<text x="62" y="283" fill="#f8fafc" font-size="16" font-family="system-ui,sans-serif" font-weight="650">Zig</text>
<text x="175" y="283" fill="#cbd5e1" font-size="14" font-family="system-ui,sans-serif">Own Zig engine and Python bridge; corrected build not run</text>
<text x="1208" y="283" text-anchor="end" fill="#60a5fa" font-size="13" font-family="system-ui,sans-serif" font-weight="700">SOURCE FROZEN</text>
<circle cx="43" cy="325" r="6" fill="#fb7185"/>
<text x="62" y="330" fill="#f8fafc" font-size="16" font-family="system-ui,sans-serif" font-weight="650">C++</text>
<text x="175" y="330" fill="#cbd5e1" font-size="14" font-family="system-ui,sans-serif">2,308 differences; five startup failures</text>
<text x="1208" y="330" text-anchor="end" fill="#fb7185" font-size="13" font-family="system-ui,sans-serif" font-weight="700">NOT COMPATIBLE</text>
<circle cx="43" cy="372" r="6" fill="#fb7185"/>
<text x="62" y="377" fill="#f8fafc" font-size="16" font-family="system-ui,sans-serif" font-weight="650">Go</text>
<text x="175" y="377" fill="#cbd5e1" font-size="14" font-family="system-ui,sans-serif">4,518 differences; four startup failures</text>
<text x="1208" y="377" text-anchor="end" fill="#fb7185" font-size="13" font-family="system-ui,sans-serif" font-weight="700">NOT COMPATIBLE</text>
