<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="2180" viewBox="0 0 1660 2180" role="img" aria-labelledby="v24-title v24-description">
<title id="v24-title">Building a faster Python re: the repaired Zig engine builds, but matching and speed have not been tested</title>
<desc id="v24-description">Python passes all 31,237 original reference checks. The newly repaired, independently implemented Zig engine completed 26 real build and inspection steps and produced byte-identical engine and bridge files in two separate builds. This new Zig engine has not run matching tests and is not a qualified candidate. The previously tested Zig engine still has 1,764 recorded differences. The latest C engine really ran all 13 test groups and has 1,262 real matching differences and no infrastructure failures. No replacement qualifies. The complete record contains 137 actual evidence files and 142 distinct signed history references. Speed, memory, confidence intervals and rankings have not been measured. The final holdout remains unopened.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:33px;font-weight:760;fill:#16324f}.heading{font-size:24px;font-weight:740;fill:#16324f}.body{font-size:15px;fill:#42556c}.name{font-size:17px;font-weight:720;fill:#16324f}.pass{font-size:15px;font-weight:750;fill:#00794c}.fail{font-size:15px;font-weight:740;fill:#a15e00}.pending{font-size:15px;font-weight:740;fill:#53667b}.big{font-size:25px;font-weight:760;fill:#16324f}.foot{font-size:12px;fill:#53667b}.small{font-size:13px;fill:#42556c}</style>
<rect width="1660" height="2180" rx="22" fill="#f4f7fb"/>
<text x="54" y="66" class="title">Can we build a faster replacement for Python re?</text>
<text x="56" y="96" class="body">The repaired Zig engine now genuinely builds twice. Whether it matches Python is NOT MEASURED.</text>
<rect x="54" y="120" width="304" height="104" rx="13" fill="#fff" stroke="#dae4ee"/>
<text x="68" y="163" class="big">31,237</text>
<text x="68" y="198" class="body">original Python reference checks</text>
<rect x="374" y="120" width="304" height="104" rx="13" fill="#fff" stroke="#dae4ee"/>
<text x="388" y="163" class="big">26 of 26</text>
<text x="388" y="198" class="body">real Zig build steps succeeded</text>
<rect x="694" y="120" width="304" height="104" rx="13" fill="#fff" stroke="#dae4ee"/>
<text x="708" y="163" class="big">2 of 2</text>
<text x="708" y="198" class="body">separate identical Zig builds</text>
<rect x="1014" y="120" width="304" height="104" rx="13" fill="#fff" stroke="#dae4ee"/>
<text x="1028" y="163" class="big">1,262</text>
<text x="1028" y="198" class="body">recorded C matching differences</text>
<rect x="1334" y="120" width="304" height="104" rx="13" fill="#fff" stroke="#dae4ee"/>
<text x="1348" y="163" class="big">NOT MEASURED</text>
<text x="1348" y="198" class="body">speed and memory</text>
<rect x="54" y="241" width="1552" height="782" rx="16" fill="#fff" stroke="#dae4ee"/>
<text x="77" y="282" class="heading">1. Does each replacement behave exactly like Python?</text>
<text x="78" y="309" class="body">Building successfully is not passing a matching test. A replacement qualifies only after every original check agrees.</text>
<rect x="75" y="326" width="1510" height="60" rx="9" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="94" y="349" class="name">Python re — reference</text>
<text x="1564" y="349" class="pass" text-anchor="end">PASSED</text>
<text x="96" y="372" class="small">All 31,237 original Python reference checks pass.</text>
<rect x="75" y="395" width="1510" height="60" rx="9" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="94" y="418" class="name">Zig — newly repaired engine</text>
<text x="1564" y="418" class="pending" text-anchor="end">BUILT; MATCHING NOT MEASURED</text>
<text x="96" y="441" class="small">26 real build and inspection steps; two separate byte-identical engine and bridge builds; no matching tests yet.</text>
<rect x="75" y="464" width="1510" height="60" rx="9" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="94" y="487" class="name">Zig — previously tested engine</text>
<text x="1564" y="487" class="fail" text-anchor="end">NOT COMPATIBLE</text>
<text x="96" y="510" class="small">3,583 fully verified passing checks; 1,764 recorded matching differences.</text>
<rect x="75" y="533" width="1510" height="60" rx="9" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="94" y="556" class="name">C — latest repaired engine</text>
<text x="1564" y="556" class="fail" text-anchor="end">NOT COMPATIBLE</text>
<text x="96" y="579" class="small">All 13 groups ran: 8 completely passed (7,325 checks); 1,262 differences; 0 runner failures.</text>
<rect x="75" y="602" width="1510" height="60" rx="9" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="94" y="625" class="name">C — earlier matching engine</text>
<text x="1564" y="625" class="fail" text-anchor="end">NOT COMPATIBLE</text>
<text x="96" y="648" class="small">7,197 fully verified passing checks; 2,094 matching differences.</text>
<rect x="75" y="671" width="1510" height="60" rx="9" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="94" y="694" class="name">Rust</text>
<text x="1564" y="694" class="fail" text-anchor="end">NOT COMPATIBLE</text>
<text x="96" y="717" class="small">7,461 fully verified passing checks; 2,042 matching differences.</text>
<rect x="75" y="740" width="1510" height="60" rx="9" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="94" y="763" class="name">C++</text>
<text x="1564" y="763" class="fail" text-anchor="end">NOT COMPATIBLE</text>
<text x="96" y="786" class="small">128 fully verified passing checks; 2,308 matching differences and 5 earlier runner failures.</text>
<rect x="75" y="809" width="1510" height="60" rx="9" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="94" y="832" class="name">Go</text>
<text x="1564" y="832" class="fail" text-anchor="end">NOT COMPATIBLE</text>
<text x="96" y="855" class="small">128 fully verified passing checks; 4,518 matching differences and 4 runner failures.</text>
<rect x="75" y="878" width="1510" height="60" rx="9" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="94" y="901" class="name">Fortran</text>
<text x="1564" y="901" class="pending" text-anchor="end">NOT READY</text>
<text x="96" y="924" class="small">Its independently built engine is not yet compatible. Matching: NOT MEASURED.</text>
<text x="78" y="983" class="body">Earlier C attempts remain recorded separately: 13 old runner failures, then one runner failure before matching.</text>
<rect x="54" y="1040" width="1552" height="648" rx="16" fill="#fff" stroke="#dae4ee"/>
<text x="77" y="1081" class="heading">2. Which C test groups still differ?</text>
<text x="78" y="1108" class="body">All 13 groups and original case records are preserved; these are observed matching results, not build results.</text>
<text x="92" y="1135" class="small">TEST GROUP</text>
<text x="1225" y="1135" class="small" text-anchor="end">ORIGINAL CHECKS</text>
<text x="1562" y="1135" class="small" text-anchor="end">RESULT</text>
<rect x="77" y="1148" width="1506" height="31" rx="5" fill="#f8fafd"/>
