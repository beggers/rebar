<text x="1225" y="1449" class="body" text-anchor="end">10,240</text>
<text x="1562" y="1449" class="fail" text-anchor="end">672 DIFFERENCES</text>
<rect x="77" y="1463" width="1506" height="31" rx="5" fill="#ffffff"/>
<text x="95" y="1484" class="body">Full public interface</text>
<text x="1225" y="1484" class="body" text-anchor="end">1,376</text>
<text x="1562" y="1484" class="fail" text-anchor="end">114 DIFFERENCES</text>
<rect x="77" y="1498" width="1506" height="31" rx="5" fill="#f8fafd"/>
