<text x="1225" y="1274" class="body" text-anchor="end">768</text>
<text x="1562" y="1274" class="pass" text-anchor="end">PASSED</text>
<rect x="77" y="1288" width="1506" height="31" rx="5" fill="#f8fafd"/>
<text x="95" y="1309" class="body">Buffer lifetime</text>
<text x="1225" y="1309" class="body" text-anchor="end">1,024</text>
<text x="1562" y="1309" class="pass" text-anchor="end">PASSED</text>
<rect x="77" y="1323" width="1506" height="31" rx="5" fill="#ffffff"/>
<text x="95" y="1344" class="body">Verbose patterns</text>
<text x="1225" y="1344" class="body" text-anchor="end">2,854</text>
<text x="1562" y="1344" class="pass" text-anchor="end">PASSED</text>
<rect x="77" y="1358" width="1506" height="31" rx="5" fill="#f8fafd"/>
<text x="95" y="1379" class="body">Public types and serialization</text>
<text x="1225" y="1379" class="body" text-anchor="end">6,912</text>
<text x="1562" y="1379" class="fail" text-anchor="end">248 DIFFERENCES</text>
<rect x="77" y="1393" width="1506" height="31" rx="5" fill="#ffffff"/>
<text x="95" y="1414" class="body">Substitutions</text>
<text x="1225" y="1414" class="body" text-anchor="end">5,120</text>
<text x="1562" y="1414" class="fail" text-anchor="end">224 DIFFERENCES</text>
<rect x="77" y="1428" width="1506" height="31" rx="5" fill="#f8fafd"/>
