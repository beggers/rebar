<text x="1225" y="1169" class="body" text-anchor="end">151</text>
<text x="1562" y="1169" class="pass" text-anchor="end">PASSED</text>
<rect x="77" y="1183" width="1506" height="31" rx="5" fill="#ffffff"/>
