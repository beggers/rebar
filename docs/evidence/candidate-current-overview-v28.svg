<text x="64" y="1551" class="heading">3. Is any replacement faster?</text>
<text x="66" y="1582" class="body">NOT MEASURED. No replacement has passed every original Python compatibility check.</text>
<text x="66" y="1611" class="body">There is no speed or memory comparison, confidence interval, ranking, or winner.</text>
<text x="66" y="1640" class="body">The 4,194,304-case final comparison is not generated and has not been opened.</text>
<text x="66" y="1669" class="body">143 verified previous files + real Rust failure archive + distinct receipt = 145 evidence files; 150 references.</text>
<text x="66" y="1698" class="body">Receipt PASS means the Rust FAIL was safely published, not that its matching passed.</text>
<text x="66" y="1727" class="body">All four original Rust files were restored against the announced preactivation journal.</text>
<text x="66" y="1756" class="body">Neither large Rust or Zig archive is inflated by graph verification.</text>
