<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1910" viewBox="0 0 1440 1910" role="img" aria-labelledby="v28-title v28-description">
<title id="v28-title">Building a faster Python re: complete Rust, Zig, and C tests all expose differences</title>
<desc id="v28-description">Python passes all 31,237 original checks. Each independently built Rust, Zig, and C candidate ran all 13 original test workers. Repaired Rust has 1,087 matching differences and 7,438 verified passing checks. Repaired Zig has 2,172 differences and 2,847 verified passing checks. C has 1,262 differences and 7,325 verified passing checks. No candidate is fully compatible. A separate earlier Zig preflight failure started zero workers. All four original Rust targets were restored against the preactivation recovery journal. The published archive receipts preserve failing candidate results; receipt PASS is not candidate PASS. The 145 actual evidence owners and 150 signed references retain all historical failures. Large archives are not decompressed. Speed, memory, and confidence have not been measured; the 4,194,304-case holdout remains unopened.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:30px;font-weight:760;fill:#16324f}.heading{font-size:22px;font-weight:740;fill:#16324f}.body{font-size:15px;fill:#42556c}.name{font-size:16px;font-weight:720;fill:#16324f}.pass{font-size:14px;font-weight:750;fill:#00794c}.fail{font-size:14px;font-weight:740;fill:#a15e00}.pending{font-size:14px;font-weight:740;fill:#53667b}.big{font-size:23px;font-weight:760;fill:#16324f}.small{font-size:13px;fill:#42556c}.foot{font-size:11px;fill:#53667b}</style>
<rect width="1440" height="1910" rx="22" fill="#f4f7fb"/>
<text x="44" y="61" class="title">Can we build a faster replacement for Python re?</text>
<text x="46" y="91" class="body">Rust, Zig, and C each ran the full test. All differ from Python. Speed is NOT MEASURED.</text>
<rect x="44" y="111" width="216" height="96" rx="12" fill="#fff" stroke="#dae4ee"/>
