<text x="1358" y="814" class="fail" text-anchor="end">NOT COMPATIBLE</text>
<text x="81" y="835" class="small">128 verified passing checks; 2,308 differences and 5 earlier worker failures.</text>
<rect x="63" y="854" width="1314" height="54" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="875" class="name">Go</text>
<text x="1358" y="875" class="fail" text-anchor="end">NOT COMPATIBLE</text>
<text x="81" y="896" class="small">128 verified passing checks; 4,518 differences and 4 earlier worker failures.</text>
<rect x="63" y="915" width="1314" height="54" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="936" class="name">Fortran</text>
<text x="1358" y="936" class="pending" text-anchor="end">NOT READY</text>
<text x="81" y="957" class="small">Independent build attempts differ; no compatible matching engine is established.</text>
<text x="65" y="998" class="body">Rust and Zig per-group counts are not in the durable receipts; missing results are not invented.</text>
<rect x="44" y="1032" width="1352" height="464" rx="15" fill="#fff" stroke="#dae4ee"/>
<text x="64" y="1070" class="heading">2. Which actual C test groups still differ?</text>
<text x="65" y="1095" class="body">All 13 independently recorded C groups are retained. Large Rust and Zig archives are not decompressed.</text>
