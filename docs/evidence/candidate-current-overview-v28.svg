<text x="1358" y="387" class="fail" text-anchor="end">NOT COMPATIBLE</text>
<text x="81" y="408" class="small">13 actual workers; 1,087 matching differences; 7,438 verified passing checks; 0 worker failures.</text>
<rect x="63" y="427" width="1314" height="54" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
