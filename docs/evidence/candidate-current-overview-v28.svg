<text x="1185" y="181" class="small">evidence / references</text>
<rect x="44" y="224" width="1352" height="791" rx="15" fill="#fff" stroke="#dae4ee"/>
<text x="64" y="262" class="heading">1. Does each replacement work like Python?</text>
<text x="65" y="287" class="body">All reported current Rust, Zig, and C results come from 13 real original matching workers.</text>
<rect x="63" y="305" width="1314" height="54" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="326" class="name">Python re — reference</text>
<text x="1358" y="326" class="pass" text-anchor="end">PASSED</text>
<text x="81" y="347" class="small">All 31,237 original Python checks pass.</text>
<rect x="63" y="366" width="1314" height="54" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
