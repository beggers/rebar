<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="1090" viewBox="0 0 1380 1090" role="img" aria-labelledby="title description">
<title id="title">Can a new engine match Python re?</title>
<desc id="description">Original correctness only, not speed. Python passes 31,237 of 31,237 checks. Rust verifies 31,237, C verifies 16,413, and Zig verifies 4,607. C++, Go, and Fortran remain unmeasured. Rust has 0 mismatches across 13 independently observed groups. A complete replacement and its independent no-delegation proof remain unestablished. Final speed and memory are not measured. No winner.</desc>
<rect width="1380" height="1090" rx="24" fill="#0b1220"/>
<text x="56" y="75" fill="#f8fafc" font-size="36" font-family="system-ui,sans-serif" font-weight="760">Can a new engine match Python re?</text>
<text x="58" y="108" fill="#cbd5e1" font-size="18" font-family="system-ui,sans-serif">The bars show compatibility, not performance.</text>
<rect x="55" y="136" width="1270" height="102" rx="15" fill="#132238" stroke="#30445e"/>
<text x="76" y="174" fill="#34d399" font-size="22" font-family="system-ui,sans-serif" font-weight="750">Rust now matches all 31,237 original Python checks</text>
<text x="77" y="208" fill="#e2e8f0" font-size="16" font-family="system-ui,sans-serif">Original checks: PASS  ·  Complete drop-in replacement: NOT YET PROVEN</text>
<text x="67" y="275" fill="#94a3b8" font-size="13" font-family="system-ui,sans-serif" font-weight="680">APPROACH</text>
<text x="185" y="275" fill="#94a3b8" font-size="13" font-family="system-ui,sans-serif" font-weight="680">ORIGINAL CHECKS PASSED</text>
<text x="744" y="275" fill="#94a3b8" font-size="13" font-family="system-ui,sans-serif" font-weight="680">WHAT THIS MEANS</text>
