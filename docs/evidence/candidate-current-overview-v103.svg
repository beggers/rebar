<rect x="184" y="388" width="320" height="18" rx="6" fill="#60a5fa"/>
<text x="518" y="407" fill="#e2e8f0" font-size="15" font-family="system-ui,sans-serif">31,237 / 31,237  ·  100%</text>
<text x="743" y="407" fill="#e2e8f0" font-size="14" font-family="system-ui,sans-serif">All 13 groups pass</text>
<text x="743" y="427" fill="#60a5fa" font-size="11" font-family="system-ui,sans-serif" font-weight="700">ORIGINAL CHECKS PASS; MORE TESTS REQUIRED</text>
