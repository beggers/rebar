<rect x="184" y="310" width="320" height="18" rx="6" fill="#34d399"/>
<text x="518" y="329" fill="#e2e8f0" font-size="15" font-family="system-ui,sans-serif">31,237 / 31,237  ·  100%</text>
<text x="743" y="329" fill="#e2e8f0" font-size="14" font-family="system-ui,sans-serif">The reference: all 13 groups pass</text>
<text x="743" y="349" fill="#34d399" font-size="11" font-family="system-ui,sans-serif" font-weight="700">REFERENCE</text>
