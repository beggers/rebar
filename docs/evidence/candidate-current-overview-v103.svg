<rect x="55" y="858" width="617" height="147" rx="14" fill="#142135" stroke="#354459"/>
<text x="76" y="892" fill="#93c5fd" font-size="18" font-family="system-ui,sans-serif" font-weight="735">What the Rust result proves</text>
<text x="77" y="925" fill="#f8fafc" font-size="14" font-family="system-ui,sans-serif">All 31,237 original checks passed in 13 real workers.</text>
<text x="77" y="954" fill="#cbd5e1" font-size="14" font-family="system-ui,sans-serif">Previous Rust result: 15,877 passed; 1,352 differed.</text>
<text x="77" y="982" fill="#cbd5e1" font-size="13" font-family="system-ui,sans-serif">No existing regular-expression package performs matching.</text>
<rect x="690" y="858" width="635" height="147" rx="14" fill="#291923" stroke="#754453"/>
<text x="711" y="892" fill="#fda4af" font-size="18" font-family="system-ui,sans-serif" font-weight="735">Still needed before a replacement can win</text>
<text x="712" y="925" fill="#f8fafc" font-size="14" font-family="system-ui,sans-serif">More compatibility tests and an independent no-delegation audit.</text>
<text x="712" y="954" fill="#e2e8f0" font-size="14" font-family="system-ui,sans-serif">Three genuinely independent engines must qualify.</text>
<text x="712" y="982" fill="#fcd34d" font-size="14" font-family="system-ui,sans-serif">FINAL SPEED: NOT MEASURED  ·  NO WINNER</text>
<text x="58" y="1048" fill="#cbd5e1" font-size="13" font-family="system-ui,sans-serif">Each result uses exactly 31,237 original Python checks. The separate hidden final test remains unopened.</text>
</svg>
