<text x="64" y="1361" class="heading">3. Is the corrected Rust result a win?</text>
<text x="66" y="1393" class="body">No. Its real result is 1,036 differences, so it is not a compatible Python re replacement.</text>
<text x="66" y="1420" class="body">The measured reduction is exactly 1,087 − 1,036 = 51 differences.</text>
<text x="66" y="1447" class="body">Verified passing checks increase from 7,438 to 8,965: 1,527 actual additional passes.</text>
<text x="66" y="1474" class="body">All 13 original matching workers completed; no infrastructure failure was recorded.</text>
<text x="66" y="1501" class="body">Receipt PASS means the actual Rust FAIL was safely recorded; it never means matching passed.</text>
<text x="66" y="1528" class="body">All four original Rust source and native file identities were restored before publication.</text>
<text x="66" y="1555" class="body">151 previous evidence owners + one genuine Rust failure archive + one receipt = 153; 158 references.</text>
<text x="66" y="1582" class="body">The matching-failure archives remain compressed; no original candidate target is inspected.</text>
<text x="66" y="1609" class="body">The 50 additional signature checks are frozen only: their reference has NOT RUN.</text>
<text x="66" y="1636" class="body">The next Zig source is frozen only: matching is NOT MEASURED.</text>
<text x="66" y="1663" class="body">Speed, memory, confidence intervals, and undefined behavior remain NOT MEASURED.</text>
<text x="66" y="1690" class="body">The 4,194,304-case final holdout is sealed; no replacement or winner is qualified.</text>
