<text x="1358" y="677" class="pending" text-anchor="end">SOURCE FROZEN; NOT TESTED</text>
<text x="80" y="696" class="small">Source preparation does not create a build, candidate result, or matching worker.</text>
<rect x="63" y="713" width="1314" height="49" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="732" class="name">Speed, memory, and final comparison</text>
<text x="1358" y="732" class="pending" text-anchor="end">NOT MEASURED</text>
<text x="80" y="751" class="small">No compatible replacement, fair speed comparison, confidence interval, or winner.</text>
<rect x="63" y="768" width="1314" height="49" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="787" class="name">Final hidden holdout</text>
<text x="1358" y="787" class="pending" text-anchor="end">NOT OPENED</text>
<text x="80" y="806" class="small">All 4,194,304 planned final comparison cases remain ungenerated and sealed.</text>
<text x="65" y="852" class="body">The new Rust receipt contains complete totals, not individual new test-group results. Missing group rows are never invented.</text>
<rect x="44" y="898" width="1352" height="410" rx="15" fill="#fff" stroke="#dae4ee"/>
<text x="64" y="934" class="heading">2. What did the previously recorded C test show?</text>
