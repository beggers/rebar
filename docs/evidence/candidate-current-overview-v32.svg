<text x="1358" y="512" class="fail" text-anchor="end">NOT COMPATIBLE</text>
<text x="80" y="531" class="small">13 workers; 2,172 differences; 2,847 verified passes.</text>
<rect x="63" y="548" width="1314" height="49" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="567" class="name">Rust — independently reproduced source build</text>
<text x="1358" y="567" class="pending" text-anchor="end">BUILD PASSED; MATCHING FAILED</text>
