<title id="title">How close are we to replacing Python’s re?</title>
<desc id="description">Three independent Rust, C and Zig engines each pass all 223,198 original and 393 deeper checks. 0 of three have passed the complete original 152-method Python suite. Three different Rust test-harness setup failures are preserved; none is a demonstrated regex mismatch. Speed and memory are not measured.</desc>
