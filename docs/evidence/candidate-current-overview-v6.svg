<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1660" viewBox="0 0 1600 1660" role="img" aria-labelledby="current-overview-title current-overview-description">
<title id="current-overview-title">Can a from-scratch engine replace Python's re, and is it faster?</title>
<desc id="current-overview-description">Python 3.14.6 passes its complete 31,237-check reference. The current Rust, C, and corrected Zig engines were each independently built identically twice; this is build evidence, not a passed compatibility test. Rust has 7,461 verified passing checks and five failed test groups. C has 7,197 verified passing checks and six failed test groups. Both include an interpreter-test infrastructure failure; neither is qualified. Both previous C failures remain preserved. The corrected Zig engine and bridge now match in two fresh builds; its earlier nonreproducible failure also remains preserved. C++ and Go have independently authored, source-pinned implementations but have not been built or tested. No replacement is qualified. Candidate speed, memory, confidence intervals, and the final holdout have not been measured or opened. The 1.5-times marker is a goal, never a result.</desc>
