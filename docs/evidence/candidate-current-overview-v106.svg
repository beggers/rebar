<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1420" viewBox="0 0 1500 1420" role="img" aria-labelledby="title description"><title id="title">How fast are the different versions?</title><desc id="description">Python is the 1.00-times baseline. Fully correct Rust is 1.24 times as fast, with an observed 1.19 to 1.30 range. It passed 31,237 original checks and 10,434 separate broader checks. It was faster on 252 of 416 practice tasks, slower on 164, including 14 shown below that were over 20 percent slower. Earlier V26, V27, and V28 results are 1.25, 0.80, and 1.23 times baseline but failed 1,145 broader checks. Rust traced 111,026 peak bytes versus Python 181,952; process peaks were equal. This is a public practice result, not a final qualification or winner.</desc><rect width="1500" height="1420" rx="26" fill="#f8fafc"/><text x="64" y="90" fill="#0f172a" font-size="42" font-family="system-ui,sans-serif" font-weight="760">How fast are the different versions?</text><text x="67" y="128" fill="#475569" font-size="20" font-family="system-ui,sans-serif">Python is 1.00×. Longer bars mean faster. Each version ran the same 416 public tasks.</text><rect x="62" y="161" width="1376" height="489" rx="20" fill="#ffffff" stroke="#e2e8f0"/><text x="92" y="207" fill="#334155" font-size="15" font-family="system-ui,sans-serif" font-weight="700">VERSION</text><text x="587" y="207" fill="#334155" font-size="15" font-family="system-ui,sans-serif" font-weight="700">SPEED COMPARED WITH PYTHON</text><line x1="987" y1="224" x2="987" y2="590" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/><text x="956" y="612" fill="#475569" font-size="14" font-family="system-ui,sans-serif">1.00×</text><rect x="77" y="229" width="1346" height="66" rx="12" fill="#d1fae5"/><text x="96" y="255" fill="#0f172a" font-size="17" font-family="system-ui,sans-serif" font-weight="740">Rust — fully correct</text><text x="97" y="277" fill="#059669" font-size="11" font-family="system-ui,sans-serif" font-weight="720">PASSED ALL ORIGINAL + BROADER CHECKS</text><rect x="588" y="241" width="496" height="30" rx="7" fill="#059669"/><text x="1098" y="264" fill="#0f172a" font-size="21" font-family="system-ui,sans-serif" font-weight="740">1.24×</text><rect x="77" y="303" width="1346" height="66" rx="12" fill="#f1f5f9"/><text x="96" y="329" fill="#0f172a" font-size="17" font-family="system-ui,sans-serif" font-weight="620">Python — original</text><text x="97" y="351" fill="#64748b" font-size="11" font-family="system-ui,sans-serif" font-weight="720">REFERENCE VERSION</text><rect x="588" y="315" width="399" height="30" rx="7" fill="#64748b"/><text x="1001" y="338" fill="#0f172a" font-size="21" font-family="system-ui,sans-serif" font-weight="740">1.00×</text><rect x="77" y="377" width="1346" height="66" rx="12" fill="#fff7ed"/><text x="96" y="403" fill="#0f172a" font-size="17" font-family="system-ui,sans-serif" font-weight="620">V26 — earlier experiment</text><text x="97" y="425" fill="#d97706" font-size="11" font-family="system-ui,sans-serif" font-weight="720">FAILED 1,145 BROADER CHECKS</text><rect x="588" y="389" width="500" height="30" rx="7" fill="#d97706"/><text x="1102" y="412" fill="#0f172a" font-size="21" font-family="system-ui,sans-serif" font-weight="740">1.25×</text><rect x="77" y="451" width="1346" height="66" rx="12" fill="#fff7ed"/><text x="96" y="477" fill="#0f172a" font-size="17" font-family="system-ui,sans-serif" font-weight="620">V27 — earlier experiment</text><text x="97" y="499" fill="#d97706" font-size="11" font-family="system-ui,sans-serif" font-weight="720">FAILED 1,145 BROADER CHECKS</text><rect x="588" y="463" width="318" height="30" rx="7" fill="#d97706"/><text x="920" y="486" fill="#0f172a" font-size="21" font-family="system-ui,sans-serif" font-weight="740">0.80×</text><rect x="77" y="525" width="1346" height="66" rx="12" fill="#fff7ed"/><text x="96" y="551" fill="#0f172a" font-size="17" font-family="system-ui,sans-serif" font-weight="620">V28 — earlier experiment</text><text x="97" y="573" fill="#d97706" font-size="11" font-family="system-ui,sans-serif" font-weight="720">FAILED 1,145 BROADER CHECKS</text><rect x="588" y="537" width="491" height="30" rx="7" fill="#d97706"/><text x="1093" y="560" fill="#0f172a" font-size="21" font-family="system-ui,sans-serif" font-weight="740">1.23×</text><rect x="62" y="675" width="670" height="158" rx="18" fill="#ecfdf5" stroke="#a7f3d0"/><text x="86" y="715" fill="#065f46" font-size="21" font-family="system-ui,sans-serif" font-weight="750">Fully correct Rust: about 24% faster overall</text><text x="88" y="751" fill="#064e3b" font-size="18" font-family="system-ui,sans-serif">Typical measured range: 1.19× to 1.30× Python</text><text x="88" y="785" fill="#065f46" font-size="15" font-family="system-ui,sans-serif">252 tasks faster · 164 slower · 14 more than 20% slower</text><text x="88" y="812" fill="#065f46" font-size="13" font-family="system-ui,sans-serif">31,237 / 31,237 original + 10,434 / 10,434 broader checks passed</text><rect x="752" y="675" width="686" height="158" rx="18" fill="#eff6ff" stroke="#bfdbfe"/><text x="777" y="715" fill="#1e3a8a" font-size="21" font-family="system-ui,sans-serif" font-weight="750">Memory used</text><text x="778" y="751" fill="#1e40af" font-size="18" font-family="system-ui,sans-serif">Tracked peak: Rust 111,026 bytes · Python 181,952 bytes</text><text x="778" y="785" fill="#1e40af" font-size="15" font-family="system-ui,sans-serif">Whole-process peak: both 44,032 KiB</text><text x="778" y="812" fill="#1e40af" font-size="13" font-family="system-ui,sans-serif">Same 1,248 public executions were profiled for each version.</text><rect x="62" y="856" width="1376" height="392" rx="20" fill="#ffffff" stroke="#e2e8f0"/><text x="87" y="897" fill="#0f172a" font-size="22" font-family="system-ui,sans-serif" font-weight="750">Every task where fully correct Rust was more than 20% slower</text><text x="89" y="928" fill="#475569" font-size="15" font-family="system-ui,sans-serif">All 14 are shown. All 164 slower tasks remain in the accompanying data.</text><text x="90" y="969" fill="#334155" font-size="15" font-family="system-ui,sans-serif">#0001  module.search</text><text x="535" y="969" fill="#b45309" font-size="15" font-family="system-ui,sans-serif" font-weight="700">1.30× slower</text><text x="90" y="1006" fill="#334155" font-size="15" font-family="system-ui,sans-serif">#0010  pattern.search</text><text x="535" y="1006" fill="#b45309" font-size="15" font-family="system-ui,sans-serif" font-weight="700">1.27× slower</text><text x="90" y="1043" fill="#334155" font-size="15" font-family="system-ui,sans-serif">#0023  match.group</text><text x="535" y="1043" fill="#b45309" font-size="15" font-family="system-ui,sans-serif" font-weight="700">1.22× slower</text><text x="90" y="1080" fill="#334155" font-size="15" font-family="system-ui,sans-serif">#0024  match.expand</text><text x="535" y="1080" fill="#b45309" font-size="15" font-family="system-ui,sans-serif" font-weight="700">1.28× slower</text><text x="90" y="1117" fill="#334155" font-size="15" font-family="system-ui,sans-serif">#0110  module.split</text><text x="535" y="1117" fill="#b45309" font-size="15" font-family="system-ui,sans-serif" font-weight="700">1.25× slower</text><text x="90" y="1154" fill="#334155" font-size="15" font-family="system-ui,sans-serif">#0119  pattern.split</text><text x="535" y="1154" fill="#b45309" font-size="15" font-family="system-ui,sans-serif" font-weight="700">1.23× slower</text><text x="90" y="1191" fill="#334155" font-size="15" font-family="system-ui,sans-serif">#0156  module.compile</text><text x="535" y="1191" fill="#b45309" font-size="15" font-family="system-ui,sans-serif" font-weight="700">1.35× slower</text><text x="770" y="969" fill="#334155" font-size="15" font-family="system-ui,sans-serif">#0209  module.search</text><text x="1215" y="969" fill="#b45309" font-size="15" font-family="system-ui,sans-serif" font-weight="700">1.41× slower</text><text x="770" y="1006" fill="#334155" font-size="15" font-family="system-ui,sans-serif">#0212  module.findall</text><text x="1215" y="1006" fill="#b45309" font-size="15" font-family="system-ui,sans-serif" font-weight="700">1.34× slower</text><text x="770" y="1043" fill="#334155" font-size="15" font-family="system-ui,sans-serif">#0218  pattern.search</text><text x="1215" y="1043" fill="#b45309" font-size="15" font-family="system-ui,sans-serif" font-weight="700">1.39× slower</text><text x="770" y="1080" fill="#334155" font-size="15" font-family="system-ui,sans-serif">#0221  pattern.findall</text><text x="1215" y="1080" fill="#b45309" font-size="15" font-family="system-ui,sans-serif" font-weight="700">1.43× slower</text><text x="770" y="1117" fill="#334155" font-size="15" font-family="system-ui,sans-serif">#0231  match.group</text><text x="1215" y="1117" fill="#b45309" font-size="15" font-family="system-ui,sans-serif" font-weight="700">1.56× slower</text><text x="770" y="1154" fill="#334155" font-size="15" font-family="system-ui,sans-serif">#0232  match.expand</text><text x="1215" y="1154" fill="#b45309" font-size="15" font-family="system-ui,sans-serif" font-weight="700">1.43× slower</text><text x="770" y="1191" fill="#334155" font-size="15" font-family="system-ui,sans-serif">#0342  module.findall</text><text x="1215" y="1191" fill="#b45309" font-size="15" font-family="system-ui,sans-serif" font-weight="700">1.22× slower</text><rect x="62" y="1268" width="1376" height="107" rx="16" fill="#fff7ed" stroke="#fed7aa"/><text x="87" y="1307" fill="#9a3412" font-size="17" font-family="system-ui,sans-serif" font-weight="720">The earlier experiments are not fully correct. This is not a final winner.</text><text x="88" y="1341" fill="#7c2d12" font-size="15" font-family="system-ui,sans-serif">Public practice only · no hidden final test opened · runtime independence not yet established</text></svg>
