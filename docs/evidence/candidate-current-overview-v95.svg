<line x1="44" y1="748" x2="1396" y2="748" stroke="#334155"/>
<text x="49" y="780" fill="#f8fafc" font-size="17" font-family="system-ui,sans-serif" font-weight="700">What changed in the latest Rust attempt?</text>
<text x="49" y="806" fill="#cbd5e1" font-size="13" font-family="system-ui,sans-serif">Rust fell from 15,749 to 14,725 confirmed checks: 1,024 fewer. A previously passing 1,024-check group now has 42 real differences.</text>
<text x="49" y="831" fill="#cbd5e1" font-size="13" font-family="system-ui,sans-serif">Three groups show at least 2,018 differences. The full difference total is NOT MEASURED because one interpreter group could not complete.</text>
<text x="49" y="856" fill="#cbd5e1" font-size="13" font-family="system-ui,sans-serif">The one fully captured failed Rust worker emitted 16 cleanup warnings. No successful nested interpreter or child guard was created.</text>
<text x="49" y="881" fill="#cbd5e1" font-size="13" font-family="system-ui,sans-serif">The separate Zig result still contains warnings from all 13 workers, with at least 143 recorded examples. All earlier results are preserved.</text>
<rect x="44" y="902" width="1352" height="108" rx="13" fill="#172338"/>
