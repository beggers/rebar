<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title description">
<title id="title">How close are from-scratch alternatives to Python re?</title>
<desc id="description">These bars show verified matching checks, not speed. Standard Python passes all 31,237 original checks. The latest Rust attempt passes 14,725, a regression of 1,024 compared with the separately preserved previous 15,749-check Rust result. It has nine passing groups, three fully observed mismatch groups containing at least 2,018 real differences, and one incomplete interpreter group. The single completely captured failed Rust worker emitted 16 deallocator warnings; no warning claim is made for the other workers. The outer worker subprocess was real, but no genuine nested Python interpreter or child guard was created. C verifies 13,606 checks. Zig verifies 4,607; all 13 Zig workers emitted cleanup warnings, with at least 143 captured examples. C++, Go, and Fortran do not have a fully measured current matching result. Speed and memory are not measured. The separate 8,244 checks are not added to the denominator. The proposed 14,155,776-case comparison remains unfrozen and unopened. No winner.</desc>
<rect width="1440" height="1080" rx="24" fill="#0b1220"/>
<text x="46" y="64" fill="#f8fafc" font-size="32" font-family="system-ui,sans-serif" font-weight="740">Building a faster Python re, from scratch</text>
<text x="47" y="103" fill="#cbd5e1" font-size="17" font-family="system-ui,sans-serif">Six independent approaches · no fully compatible replacement · no winner</text>
<rect x="44" y="125" width="1352" height="78" rx="13" fill="#172338"/>
<text x="63" y="156" fill="#f8fafc" font-size="16" font-family="system-ui,sans-serif" font-weight="690">The bars measure matching correctness, not speed.</text>
<text x="63" y="181" fill="#cbd5e1" font-size="14" font-family="system-ui,sans-serif">Every result uses the same 31,237 original Python checks. Failed, unfinished, and unmeasured checks are never counted as passes.</text>
