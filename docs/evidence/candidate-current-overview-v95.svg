<text x="63" y="957" fill="#cbd5e1" font-size="13" font-family="system-ui,sans-serif">NOT FROZEN · NOT GENERATED · NOT OPENED · NOT RUN. Speed, memory, confidence, and rankings: NOT MEASURED.</text>
<text x="63" y="982" fill="#cbd5e1" font-size="12" font-family="system-ui,sans-serif">The separate 8,244 reference checks are not included in the 31,237-check original comparison.</text>
