<text x="62" y="905" fill="#cbd5e1" font-size="12" font-family="system-ui,sans-serif">The earlier 4,194,304-case proposal and previous Zig results remain preserved; no winner has been selected.</text>
<text x="48" y="951" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif">Overview 90 · all previous evidence preserved · no external regex wrapper · no fully compatible replacement.</text>
