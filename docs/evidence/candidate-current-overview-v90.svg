<text x="48" y="709" fill="#f8fafc" font-size="16" font-family="system-ui,sans-serif" font-weight="670">Compatibility, not just a successful build</text>
<text x="48" y="738" fill="#cbd5e1" font-size="13" font-family="system-ui,sans-serif">C completed 5 of 13 groups; Rust completed 8 of 13; Zig completed 9 of 13.</text>
<text x="48" y="761" fill="#cbd5e1" font-size="13" font-family="system-ui,sans-serif">Observed differences: C at least 236; Rust at least 1,296; Zig at least 1,540. Complete totals: NOT MEASURED.</text>
<text x="48" y="784" fill="#cbd5e1" font-size="13" font-family="system-ui,sans-serif">Zig: 10 worker imports individually proven; 3 unknown. Four test groups remain incomplete.</text>
<text x="48" y="807" fill="#cbd5e1" font-size="13" font-family="system-ui,sans-serif">A published test report or successful native build does not mean an engine passed.</text>
<rect x="44" y="830" width="1352" height="91" rx="12" fill="#172338"/>
<text x="62" y="858" fill="#f8fafc" font-size="16" font-family="system-ui,sans-serif" font-weight="670">Proposed final speed comparison: 14,155,776 cases</text>
