<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="970" viewBox="0 0 1440 970" role="img" aria-labelledby="title description">
<title id="title">Progress toward a faster, fully compatible Python re</title>
<desc id="description">Six independent first-party engines are compared against unchanged Python 3.14.6. The original compatibility test contains 31,237 checks in 13 groups. A separate set of 8,244 differential checks is not included in that denominator. C has 13,094 verified checks from two clean groups, three differing groups containing at least 236 observed differences, seven candidate execution failures, and one infrastructure failure. Rust has 12,942 verified checks from six clean groups, two differing groups containing at least 1,296 observed differences, and five infrastructure failures. The latest Zig run has 3,583 verified checks from six clean groups, three differing groups containing at least 1,540 observed differences, and four infrastructure failures. Ten Zig worker imports are individually proven guarded and three remain genuinely unknown; one infrastructure failure occurred after a proven guarded import. The complete mismatch totals for all three latest runs are not measured. The previous Zig run and C++, Go, and Fortran are preserved. No engine is fully compatible, no speed or memory has been measured, and the proposed 14,155,776-case final comparison is not frozen, generated, opened, or run.</desc>
<rect width="1440" height="970" rx="22" fill="#0b1220"/>
<text x="44" y="60" fill="#f8fafc" font-size="31" font-family="system-ui,sans-serif" font-weight="730">Building a faster Python re, from scratch</text>
<text x="44" y="97" fill="#cbd5e1" font-size="17" font-family="system-ui,sans-serif">6 independent engines · 0 fully compatible · speed NOT MEASURED</text>
<rect x="44" y="119" width="1352" height="57" rx="11" fill="#172338"/>
<text x="62" y="144" fill="#f8fafc" font-size="15" font-family="system-ui,sans-serif" font-weight="650">What the bars mean: checks actually confirmed against Python, out of 31,237.</text>
<text x="62" y="165" fill="#cbd5e1" font-size="13" font-family="system-ui,sans-serif">Unfinished checks are unknown, not passes. The separate 8,244-check test is not counted.</text>
<text x="45" y="211" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif" font-weight="650">ENGINE</text>
