<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1130" viewBox="0 0 1480 1130" role="img" aria-labelledby="title description">
<title id="title">Python regular-expression correctness: Rust improves; speed not measured</title>
<desc id="description">The fixed original correctness denominator is 31,237 checks. Python passes 31,237, C verifies 16,413, Rust verifies 15,877, and Zig verifies 4,607. Rust improves by 1,152 checks over the preceding graph and completes all thirteen groups with thirteen distinct workers and no worker failures. Eleven Rust groups pass. Exactly 1,352 semantic mismatches remain: 240 substitution and 1,112 shape. Managed cases and genuine subinterpreter cases both pass. Three other families are not measured. Bars show correctness, never speed. A 141,557,760-case future comparison is only a proposal: not frozen, generated, or opened. No candidate qualifies; no winner.</desc>
<rect width="1480" height="1130" rx="24" fill="#0b1220"/>
<text x="58" y="72" fill="#f8fafc" font-size="35" font-family="system-ui,sans-serif" font-weight="750">Can we build a faster, fully compatible Python re?</text>
<text x="60" y="108" fill="#cbd5e1" font-size="19" font-family="system-ui,sans-serif">Correctness first. Speed has not been measured.</text>
