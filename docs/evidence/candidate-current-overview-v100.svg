<text x="769" y="968" fill="#e2e8f0" font-size="15" font-family="system-ui,sans-serif">141,557,760 future comparison cases are only an unopened proposal.</text>
<text x="769" y="998" fill="#fcd34d" font-size="15" font-family="system-ui,sans-serif">Final protocol: NOT FROZEN. Cases: NOT GENERATED; NOT OPENED.</text>
<text x="769" y="1026" fill="#cbd5e1" font-size="14" font-family="system-ui,sans-serif">The original denominator stays 31,237; 8,244 other checks stay separate.</text>
<text x="63" y="1085" fill="#cbd5e1" font-size="14" font-family="system-ui,sans-serif">Six independent candidate families are shown. None is fully qualified. Every bar measures correctness, never speed.</text>
