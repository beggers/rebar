<text x="81" y="904" fill="#93c5fd" font-size="18" font-family="system-ui,sans-serif" font-weight="720">What improved in Rust?</text>
<text x="82" y="938" fill="#e2e8f0" font-size="15" font-family="system-ui,sans-serif">All 13 groups completed; 11 passed; 13 workers were distinct.</text>
<text x="82" y="968" fill="#e2e8f0" font-size="15" font-family="system-ui,sans-serif">Managed checks: 1,024 pass. Real subinterpreter checks: 128 pass.</text>
<text x="82" y="998" fill="#fda4af" font-size="15" font-family="system-ui,sans-serif">Remaining exact losses: substitution 240 + shape 1,112 = 1,352.</text>
