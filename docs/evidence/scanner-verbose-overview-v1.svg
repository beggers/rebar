<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="550" viewBox="0 0 1120 550" role="img" aria-labelledby="scanner-title scanner-desc">
<title id="scanner-title">Extra Python Scanner compatibility checks</title>
<desc id="scanner-desc">Python, Rust, C, and Zig are compared with the same separately frozen 2,854 original Python Scanner checks. Green matches Python; red does not; gray has not yet been measured. This graph contains no speed result or hidden benchmark.</desc>
<rect width="1120" height="550" rx="18" fill="#f8fafc"/>
<text x="42" y="53" fill="#0f172a" font-family="system-ui,sans-serif" font-size="26" font-weight="700">Extra Python Scanner compatibility</text>
<text x="42" y="82" fill="#475569" font-family="system-ui,sans-serif" font-size="15">The same 2,854 extra Python checks for every engine &#183; speed not measured</text>
<rect x="43" y="104" width="14" height="14" rx="3" fill="#15803d"/><text x="65" y="116" fill="#334155" font-family="system-ui,sans-serif" font-size="13">Matches Python</text>
<rect x="290" y="104" width="14" height="14" rx="3" fill="#dc2626"/><text x="312" y="116" fill="#334155" font-family="system-ui,sans-serif" font-size="13">Does not match Python</text>
<rect x="537" y="104" width="14" height="14" rx="3" fill="#94a3b8"/><text x="559" y="116" fill="#334155" font-family="system-ui,sans-serif" font-size="13">Not yet measured</text>
<text x="43" y="168" fill="#0f172a" font-family="system-ui,sans-serif" font-size="17" font-weight="700">Python baseline</text>
<text x="1038" y="168" fill="#15803d" text-anchor="end" font-family="system-ui,sans-serif" font-size="14" font-weight="600">2,854 / 2,854 match Python</text>
<rect x="43" y="178" width="996" height="24" rx="6" fill="#e2e8f0"/>
<rect x="43" y="178" width="996" height="24" fill="#15803d"><title>Python baseline: 2,854 matches python out of 2,854</title></rect>
<text x="43" y="246" fill="#0f172a" font-family="system-ui,sans-serif" font-size="17" font-weight="700">Rust</text>
<text x="1038" y="246" fill="#dc2626" text-anchor="end" font-family="system-ui,sans-serif" font-size="14" font-weight="600">2,738 / 2,854 match Python</text>
<rect x="43" y="256" width="996" height="24" rx="6" fill="#e2e8f0"/>
<rect x="43" y="256" width="955" height="24" fill="#15803d"><title>Rust: 2,738 matches python out of 2,854</title></rect>
<rect x="998" y="256" width="41" height="24" fill="#dc2626"><title>Rust: 116 does not match python out of 2,854</title></rect>
<text x="43" y="324" fill="#0f172a" font-family="system-ui,sans-serif" font-size="17" font-weight="700">C</text>
<text x="1038" y="324" fill="#dc2626" text-anchor="end" font-family="system-ui,sans-serif" font-size="14" font-weight="600">2,738 / 2,854 match Python</text>
<rect x="43" y="334" width="996" height="24" rx="6" fill="#e2e8f0"/>
<rect x="43" y="334" width="955" height="24" fill="#15803d"><title>C: 2,738 matches python out of 2,854</title></rect>
<rect x="998" y="334" width="41" height="24" fill="#dc2626"><title>C: 116 does not match python out of 2,854</title></rect>
<text x="43" y="402" fill="#0f172a" font-family="system-ui,sans-serif" font-size="17" font-weight="700">Zig</text>
<text x="1038" y="402" fill="#dc2626" text-anchor="end" font-family="system-ui,sans-serif" font-size="14" font-weight="600">1,490 / 2,854 match Python</text>
<rect x="43" y="412" width="996" height="24" rx="6" fill="#e2e8f0"/>
<rect x="43" y="412" width="519" height="24" fill="#15803d"><title>Zig: 1,490 matches python out of 2,854</title></rect>
<rect x="562" y="412" width="477" height="24" fill="#dc2626"><title>Zig: 1,364 does not match python out of 2,854</title></rect>
<text x="43" y="474" fill="#475569" font-family="system-ui,sans-serif" font-size="12">These are 2,854 separately frozen Scanner checks. They do not change the original 2,807 checks or the 1,024 memory-safety checks.</text>
<text x="43" y="494" fill="#475569" font-family="system-ui,sans-serif" font-size="12">All failures and older results remain in the complete evidence. Final speed and the expanded holdout remain not measured.</text>
