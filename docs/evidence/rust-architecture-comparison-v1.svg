<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1180" viewBox="0 0 1280 1180" role="img" aria-labelledby="title description">
<title id="title">Rust architecture comparison: public speed gains do not establish correctness</title>
<desc id="description">Python standard-library baseline 1.0x; original public Rust 0.8649792983684755x; Rust V26 exploratory public 1.2520878685068846x, 95 percent confidence interval 1.1990748170405823 to 1.3083112791522158; V26 dense public cohort 1.979099276996251x. Rust V27 exploratory public 0.7967512788167544x, 95 percent confidence interval 0.7477430408484538 to 0.8453719226231972; V27 dense public cohort 0.4205648528352947x. V26 and V27 both remain unqualified: their full 10,434-case public gates failed with 1,145 mismatches. V26 has 247 of 416 public cases faster and 11 regressions over 20 percent; V27 has 138 of 416 faster and 143 regressions over 20 percent. The frozen original suite retains 1,352 mismatches; no final winner exists.</desc>
<rect width="1280" height="1180" fill="#f6f8fc"/>
<rect x="34" y="32" width="1212" height="1112" rx="24" fill="#ffffff" stroke="#d9e1ed" stroke-width="1.5"/>
<text x="70" y="91" fill="#172238" font-family="system-ui, sans-serif" font-size="30" font-weight="760">Rust architecture: V26 faster, V27 slower, both fail</text>
<text x="70" y="122" fill="#56647b" font-family="system-ui, sans-serif" font-size="15">Public development evidence only. Speed is relative to Python; above 1.0x is faster.</text>
