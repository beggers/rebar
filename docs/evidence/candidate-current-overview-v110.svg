<text x="617" y="630" fill="#a78bfa" font-size="18" font-family="system-ui,sans-serif" font-weight="750">100%</text>
<rect x="792" y="612" width="240" height="20" rx="7" fill="#293950"/>
<text x="792" y="664" fill="#cbd5e1" font-size="14" font-family="system-ui,sans-serif">NOT MEASURED</text>
<text x="1064" y="638" fill="#a78bfa" font-size="15" font-family="system-ui,sans-serif" font-weight="700">Wider test not measured</text>
