<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="1150" viewBox="0 0 1540 1150" role="img" aria-labelledby="title description">
<title id="title">Recorded progress toward a faster Python re</title>
<desc id="description">Bars show verified matching checks against Python, not speed. Python passes all 31,237 original checks. Rust verifies 14,725; C verifies 13,606; the earlier Zig run verifies 4,607. The published suite outcomes include all 13 C group results and an observed lower bound of 606 differences, but individual failing examples are not all recorded. The number and completeness of individually recorded examples are not measured by this graph. Five C candidate workers did not complete; zero infrastructure failures were observed. The corrected Zig run failed before matching, so corrected matching, workers, and cleanup remain not measured. Rust warning counts apply only to its captured failed worker. The separate 8,244 reference checks are excluded from the original denominator. The proposed 14,155,776-case speed test is not frozen, not generated, and not opened. Speed, memory, confidence, and rankings are not measured. No winner.</desc>
<rect width="1540" height="1150" rx="24" fill="#0b1220"/>
<text x="48" y="66" fill="#f8fafc" font-size="32" font-family="system-ui,sans-serif" font-weight="740">Building a faster Python re, from scratch</text>
<text x="49" y="103" fill="#cbd5e1" font-size="17" font-family="system-ui,sans-serif">Six independently written approaches; no fully compatible replacement; no measured speed; no winner</text>
<rect x="46" y="126" width="1448" height="80" rx="13" fill="#172338"/>
<text x="66" y="157" fill="#f8fafc" font-size="16" font-family="system-ui,sans-serif" font-weight="690">These bars show compatibility with Python, not speed.</text>
<text x="66" y="184" fill="#cbd5e1" font-size="14" font-family="system-ui,sans-serif">Every bar uses the same 31,237 original checks. Failed, incomplete, and unmeasured checks are never counted as passing.</text>
<text x="50" y="246" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif" font-weight="690">APPROACH</text>
<text x="159" y="246" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif" font-weight="690">ORIGINAL PYTHON CHECKS CONFIRMED</text>
<text x="724" y="246" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif" font-weight="690">WHAT WAS ACTUALLY RECORDED</text>
<text x="1269" y="246" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif" font-weight="690">SPEED</text>
<text x="1490" y="246" text-anchor="end" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif" font-weight="690">RESULT</text>
