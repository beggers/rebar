<line x1="46" y1="757" x2="1494" y2="757" stroke="#334155"/>
<text x="51" y="789" fill="#f8fafc" font-size="17" font-family="system-ui,sans-serif" font-weight="700">What the published reports can actually prove</text>
<text x="51" y="817" fill="#cbd5e1" font-size="13" font-family="system-ui,sans-serif">The C report preserves all 13 published suite outcomes. Its observed lower bound is 606 differences; individual failing examples are not all recorded.</text>
<text x="51" y="845" fill="#cbd5e1" font-size="13" font-family="system-ui,sans-serif">Five C candidate workers did not finish. Individual counterexample completeness: NOT MEASURED. Infrastructure failures: 0.</text>
<text x="51" y="873" fill="#cbd5e1" font-size="13" font-family="system-ui,sans-serif">The newer Zig controller stopped before matching; its corrected matching and cleanup are NOT MEASURED. The prior Zig and Rust results are unchanged.</text>
<rect x="46" y="898" width="1448" height="119" rx="13" fill="#172338"/>
