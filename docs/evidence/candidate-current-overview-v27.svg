<text x="65" y="999" class="body">All Zig worker streams are archived. Per-group Zig difference counts are not in the receipt and are not invented.</text>
<rect x="44" y="1032" width="1352" height="514" rx="15" fill="#fff" stroke="#dae4ee"/>
