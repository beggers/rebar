<title id="v50-title">Building a faster Python re: no compatible replacement yet; Rust differs on 928 checks and its two new ideas are untested</title>
<desc id="v50-description">The pinned Python 3.14.6 baseline was independently verified. The latest actual Rust replacement completed 13 workers, failed 928 compatibility checks and explicitly verified 8,965 passing observations; it is not compatible. Two combined first-party buffer-handling and match-serialization ideas belong to the same Rust family. Both are source only: neither has been built or tested. There are six replacement families, one actually tested family and zero currently runnable or qualified replacements. Speed, memory and repair effectiveness are not measured. The 31,237 original checks, 50 signature checks, 32 public observations and 32 large-input observations are separate. The 4,194,304-case final comparison has not been generated or opened. Historical Rust, C and Zig failures are preserved. Four and only four new serialization source owners raise authenticated lower bounds from 172 and 177 to 176 and 181; the small Rust failure receipt proves no failure-category breakdown.</desc>
