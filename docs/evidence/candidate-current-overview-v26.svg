<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1960" viewBox="0 0 1440 1960" role="img" aria-labelledby="v26-title v26-description">
<title id="v26-title">Building a faster Python re: the first repaired Zig test stopped before matching</title>
<desc id="v26-description">Python passes all 31,237 frozen checks. A real repaired Zig test controller stopped once during setup, before activation and before any matching worker started. Both original native Zig files were unchanged. A durable archive and its separate receipt preserve the complete failure, producing 141 distinct actual evidence files and 146 authenticated references. The independent Rust and Zig source builds completed 28 and 26 actual steps, but their repaired matching remains unmeasured. The independently tested C engine has 1,262 genuine matching differences across all 13 original groups. Earlier Rust, Zig, C, C++, and Go losses remain visible. No replacement qualifies. Speed, memory, confidence intervals, rankings, and undefined behavior are not measured; the 4,194,304-case final holdout has not been opened.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:31px;font-weight:760;fill:#16324f}.heading{font-size:22px;font-weight:740;fill:#16324f}.body{font-size:15px;fill:#42556c}.name{font-size:16px;font-weight:720;fill:#16324f}.pass{font-size:14px;font-weight:750;fill:#00794c}.fail{font-size:14px;font-weight:740;fill:#a15e00}.pending{font-size:14px;font-weight:740;fill:#53667b}.big{font-size:23px;font-weight:760;fill:#16324f}.small{font-size:13px;fill:#42556c}.foot{font-size:11px;fill:#53667b}</style>
<rect width="1440" height="1960" rx="22" fill="#f4f7fb"/>
<text x="44" y="61" class="title">Can we build a faster replacement for Python re?</text>
<text x="46" y="91" class="body">The new Zig test stopped during setup. No matching test ran, so correctness and speed are NOT MEASURED.</text>
<rect x="44" y="111" width="216" height="96" rx="12" fill="#fff" stroke="#dae4ee"/>
<text x="55" y="151" class="big">31,237</text>
<text x="55" y="181" class="small">original Python checks</text>
<rect x="270" y="111" width="216" height="96" rx="12" fill="#fff" stroke="#dae4ee"/>
<text x="281" y="151" class="big">0</text>
<text x="281" y="181" class="small">compatible replacements</text>
<rect x="496" y="111" width="216" height="96" rx="12" fill="#fff" stroke="#dae4ee"/>
<text x="507" y="151" class="big">1,262</text>
<text x="507" y="181" class="small">measured C differences</text>
<rect x="722" y="111" width="216" height="96" rx="12" fill="#fff" stroke="#dae4ee"/>
<text x="733" y="151" class="big">1</text>
<text x="733" y="181" class="small">recorded Zig setup failure</text>
<rect x="948" y="111" width="216" height="96" rx="12" fill="#fff" stroke="#dae4ee"/>
<text x="959" y="151" class="big">NOT MEASURED</text>
<text x="959" y="181" class="small">speed versus Python</text>
<rect x="1174" y="111" width="216" height="96" rx="12" fill="#fff" stroke="#dae4ee"/>
<text x="1185" y="151" class="big">141 / 146</text>
<text x="1185" y="181" class="small">evidence files / references</text>
<rect x="44" y="224" width="1352" height="734" rx="15" fill="#fff" stroke="#dae4ee"/>
<text x="64" y="262" class="heading">1. Does each replacement work like Python?</text>
<text x="65" y="287" class="body">A successful build is not a passed matching test. A setup failure is not a matching result.</text>
<rect x="63" y="305" width="1314" height="54" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="326" class="name">Python re — reference</text>
<text x="1358" y="326" class="pass" text-anchor="end">PASSED</text>
<text x="81" y="347" class="small">All 31,237 original checks pass; this is the compatibility baseline.</text>
<rect x="63" y="366" width="1314" height="54" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="387" class="name">Zig — newly repaired engine</text>
<text x="1358" y="387" class="fail" text-anchor="end">SETUP STOPPED; 0 TESTS</text>
<text x="81" y="408" class="small">One real controller exited 1 before activation or matching. Both original Zig files were unchanged.</text>
<rect x="63" y="427" width="1314" height="54" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="448" class="name">Rust — newly repaired engine</text>
<text x="1358" y="448" class="pending" text-anchor="end">BUILT; MATCHING NOT MEASURED</text>
<text x="81" y="469" class="small">28 genuine first-party build and inspection steps; independently repeated native outputs.</text>
<rect x="63" y="488" width="1314" height="54" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="509" class="name">C — latest repaired engine</text>
<text x="1358" y="509" class="fail" text-anchor="end">NOT COMPATIBLE</text>
<text x="81" y="530" class="small">All 13 groups ran: 7,325 verified passing checks and 1,262 matching differences.</text>
<rect x="63" y="549" width="1314" height="54" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
