<text x="1358" y="570" class="fail" text-anchor="end">NOT COMPATIBLE</text>
<text x="81" y="591" class="small">7,461 verified passing checks; 2,042 recorded matching differences.</text>
<rect x="63" y="610" width="1314" height="54" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="631" class="name">Zig — previously tested engine</text>
<text x="1358" y="631" class="fail" text-anchor="end">NOT COMPATIBLE</text>
<text x="81" y="652" class="small">3,583 verified passing checks; 1,764 recorded matching differences.</text>
<rect x="63" y="671" width="1314" height="54" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="692" class="name">C — earlier tested engine</text>
<text x="1358" y="692" class="fail" text-anchor="end">NOT COMPATIBLE</text>
<text x="81" y="713" class="small">7,197 verified passing checks; 2,094 recorded matching differences.</text>
<rect x="63" y="732" width="1314" height="54" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="753" class="name">C++</text>
<text x="1358" y="753" class="fail" text-anchor="end">NOT COMPATIBLE</text>
<text x="81" y="774" class="small">128 verified passing checks; 2,308 recorded differences and 5 earlier worker failures.</text>
<rect x="63" y="793" width="1314" height="54" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="814" class="name">Go</text>
<text x="1358" y="814" class="fail" text-anchor="end">NOT COMPATIBLE</text>
<text x="81" y="835" class="small">128 verified passing checks; 4,518 recorded differences and 4 earlier worker failures.</text>
<rect x="63" y="854" width="1314" height="54" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="875" class="name">Fortran</text>
<text x="1358" y="875" class="pending" text-anchor="end">NOT READY</text>
<text x="81" y="896" class="small">Independent build attempts differ; no compatible matching engine has been established.</text>
<text x="65" y="943" class="body">The first-party Zig build itself previously completed 26 genuine steps; the interrupted controller did not test it.</text>
<rect x="44" y="975" width="1352" height="558" rx="15" fill="#fff" stroke="#dae4ee"/>
<text x="64" y="1013" class="heading">2. Which complete C test groups still differ?</text>
<text x="65" y="1038" class="body">Every original group and every loss remains visible. A passed example inside a failed group is not a passing group.</text>
