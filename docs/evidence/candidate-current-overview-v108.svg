<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1108" viewBox="0 0 1480 1108" role="img" aria-labelledby="title description">
<title id="title">How close are we to a faster Python re?</title>
<desc id="description">Compatibility, not speed. Python, Rust, and Zig each pass all 31,237 original Python re checks with zero differences. Rust also passes all 10,434 separate wider checks; Zig's wider result is not measured. C has 22,798 verified passing original checks and 224 remaining differences. Earlier C and Zig differences remain recorded. The current Rust build has no matching static or live independence audit; an older Rust build passed a separate inspection. No candidate is fully qualified, final hidden speed is not measured, and there is no winner.</desc>
<rect width="1480" height="1108" rx="24" fill="#0c1421"/>
<text x="56" y="80" fill="#f8fafc" font-size="38" font-family="system-ui,sans-serif" font-weight="760">How close are we to a faster Python re?</text>
<text x="58" y="117" fill="#cbd5e1" font-size="19" font-family="system-ui,sans-serif">This picture measures matching Python correctly. It does not measure speed.</text>
<rect x="55" y="151" width="859" height="164" rx="18" fill="#11293a" stroke="#32866d"/>
<text x="79" y="190" fill="#86efac" font-size="22" font-family="system-ui,sans-serif" font-weight="730">Rust and Zig both pass the complete original test</text>
<text x="80" y="242" fill="#f8fafc" font-size="31" font-family="system-ui,sans-serif" font-weight="760">31,237 / 31,237 checks each</text>
<text x="81" y="282" fill="#d1fae5" font-size="17" font-family="system-ui,sans-serif">Rust also passes 10,434 / 10,434 wider checks.</text>
<rect x="934" y="151" width="490" height="164" rx="18" fill="#182438" stroke="#52647f"/>
<text x="958" y="190" fill="#e2e8f0" font-size="20" font-family="system-ui,sans-serif" font-weight="700">Independence still needs proof</text>
<text x="958" y="233" fill="#86efac" font-size="18" font-family="system-ui,sans-serif" font-weight="720">Current Rust audit: NOT ESTABLISHED</text>
<text x="958" y="274" fill="#fcd34d" font-size="15" font-family="system-ui,sans-serif">Older Rust build passed inspection</text>
<text x="66" y="367" fill="#cbd5e1" font-size="14" font-family="system-ui,sans-serif" font-weight="730">APPROACH</text>
