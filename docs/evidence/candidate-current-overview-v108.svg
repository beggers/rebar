<text x="796" y="367" fill="#cbd5e1" font-size="14" font-family="system-ui,sans-serif" font-weight="730">SEPARATE WIDER TEST</text>
<text x="1156" y="367" fill="#cbd5e1" font-size="14" font-family="system-ui,sans-serif" font-weight="730">RESULT</text>
