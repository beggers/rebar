<text x="57" y="113" fill="#f8fafc" font-size="35" font-family="system-ui,sans-serif" font-weight="760">Three memory scopes tell different stories</text>
<text x="59" y="147" fill="#cbd5e1" font-size="18" font-family="system-ui,sans-serif">Native heap, whole-process RSS, and Python-only tracing are separate measurements.</text>
