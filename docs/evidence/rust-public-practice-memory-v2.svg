<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1140" viewBox="0 0 1480 1140" role="img" aria-labelledby="title description">
<title id="title">Public practice memory: native heap, process RSS, and Python allocations are different</title>
<desc id="description">Public practice only. Rust allocated 104,211,416 native bytes over 260,204 allocation calls; Python allocated 100,547,111 bytes over 284,705 calls. Native heap peaks were 53,002,684 Rust and 53,002,716 Python bytes. Whole-process peak RSS was 71,660 Rust and 38,172 Python kibibytes. Python-only tracemalloc peaks were 114,389 Rust and 192,184 Python bytes. These measure different scopes and must never be conflated. The files called CPU reports are sorted by leaked bytes; per-function CPU is not measured. Both profiler logs explicitly report that the sampling timer could not be set. Confidence, final memory, final speed, and the sealed holdout remain unmeasured or unopened.</desc>
