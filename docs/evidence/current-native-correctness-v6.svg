<text x="1000" y="972" class="pass">PASS</text>
<text x="66" y="1012" class="strong">Zig</text>
<rect x="158" y="994" width="574" height="24" rx="7" fill="#16854f"/>
<text x="746" y="1012" class="strong">223,198 / 223,198</text>
<text x="1000" y="1012" class="pass">PASS</text>
<text x="56" y="1071" class="heading">Additional difficult cases</text>
<text x="56" y="1092" class="small">The same 393 fixed cases for each independent engine.</text>
<text x="66" y="1125" class="strong">Rust</text>
<rect x="158" y="1107" width="574" height="23" rx="7" fill="#16854f"/>
<text x="746" y="1125" class="strong">393 / 393</text>
<text x="1000" y="1125" class="pass">PASS</text>
<text x="66" y="1163" class="strong">C</text>
<rect x="158" y="1145" width="574" height="23" rx="7" fill="#16854f"/>
<text x="746" y="1163" class="strong">393 / 393</text>
<text x="1000" y="1163" class="pass">PASS</text>
<text x="66" y="1201" class="strong">Zig</text>
<rect x="158" y="1183" width="574" height="23" rx="7" fill="#16854f"/>
<text x="746" y="1201" class="strong">393 / 393</text>
<text x="1000" y="1201" class="pass">PASS</text>
<text x="56" y="1258" class="heading">How the Python-test scope is counted</text>
<rect x="54" y="1272" width="1092" height="96" rx="11" fill="#ffffff" stroke="#dce5ef"/>
<text x="72" y="1300" class="body">165 original methods = 152 public records + 13 private tests in 2 named classes. No public test is waived.</text>
<text x="72" y="1326" class="small">DebugTests: 4 private matching-opcode tests · ImplementationTest: 9 private compiler and implementation tests.</text>
<text x="72" y="1349" class="small">304 native-owner checks + 304 cached-matcher checks verify the engine remained its own.</text>
<text x="56" y="1407" class="heading">Earlier attempts are not hidden</text>
<text x="57" y="1429" class="small">Previous Rust attempt: 139 passes + 11 harness errors + 1 real gap + 1 debug skip.</text>
<text x="57" y="1450" class="small">Three earlier setup failures: missing bridge wiring · anti-delegation import guard · isolated controller guard.</text>
<rect x="54" y="1464" width="1092" height="77" rx="11" fill="#ffffff" stroke="#dce5ef"/>
<text x="72" y="1489" class="footer">Overall: no engine has yet passed every required original Python test.</text>
<text x="72" y="1511" class="small">Speed and memory: NOT MEASURED · holdout: NOT ACCESSED.</text>
<text x="72" y="1530" class="small">Outer controller stderr and publication receipt: NOT PRESERVED.</text>
</svg>
