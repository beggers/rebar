<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1560" viewBox="0 0 1200 1560" role="img" aria-labelledby="title description">
<title id="title">Can these engines replace Python’s re?</title>
<desc id="description">Three from-scratch regular-expression engines are compared against Python 3.14.6. All three pass 223,198 broad cases and 393 deeper cases. The original Python test source has 165 methods: 152 public records and 13 explicitly waived private methods in two named classes. Two separate Python baseline runs each pass 151 runnable methods and share one genuine debug-only skip. The latest Rust attempt passes 150 methods, reports one real missing pickling helper, records the same debug skip, and has zero test-harness errors. C and Zig have not yet run these original tests. All 304 native-owner checks and 304 cached-matcher checks ran. An earlier Rust attempt had 139 passes, 11 test-harness errors, the same one real gap, and the same one debug skip; three earlier setup failures are preserved. The outer controller&#x27;s stderr and publication receipt were not preserved. Speed and memory are not measured; the holdout remains sealed. No engine is yet a qualified replacement.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.title{font-size:34px;font-weight:760;fill:#10223b}.subtitle{font-size:15px;fill:#43536b}.metric{font-size:30px;font-weight:760;fill:#10223b}.metric-label{font-size:13px;fill:#43536b}.heading{font-size:20px;font-weight:730;fill:#10223b}.body{font-size:15px;fill:#25364e}.small{font-size:13px;fill:#43536b}.strong{font-size:16px;font-weight:720;fill:#10223b}.pass{font-size:14px;font-weight:720;fill:#116139}.fail{font-size:14px;font-weight:720;fill:#aa2831}.pending{font-size:14px;font-weight:720;fill:#485870}.footer{font-size:15px;font-weight:680;fill:#25364e}</style>
<rect width="1200" height="1560" rx="20" fill="#f5f8fc"/>
<text x="54" y="70" class="title">Can these engines replace Python’s re?</text>
<text x="56" y="102" class="subtitle">Three independently built engines · honest comparison with Python 3.14.6</text>
<rect x="54" y="130" width="240" height="92" rx="13" fill="#ffffff" stroke="#dce5ef"/>
