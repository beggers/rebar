<text x="69" y="199" class="metric-label">from-scratch engines</text>
<rect x="338" y="130" width="240" height="92" rx="13" fill="#ffffff" stroke="#dce5ef"/>
<text x="353" y="171" class="metric">150 / 151</text>
<text x="353" y="199" class="metric-label">Rust runnable tests passed</text>
<rect x="622" y="130" width="240" height="92" rx="13" fill="#ffffff" stroke="#dce5ef"/>
<text x="637" y="171" class="metric">1</text>
<text x="637" y="199" class="metric-label">real compatibility gap</text>
<rect x="906" y="130" width="240" height="92" rx="13" fill="#ffffff" stroke="#dce5ef"/>
<text x="921" y="171" class="metric">0</text>
<text x="921" y="199" class="metric-label">qualified replacements</text>
<text x="56" y="264" class="heading">The original Python tests: what really happened</text>
<text x="56" y="286" class="small">Both Python runs pass 151 runnable methods; one identical debug-build-only test is skipped.</text>
<rect x="54" y="301" width="1092" height="186" rx="12" fill="#ffffff" stroke="#dce5ef"/>
<text x="73" y="331" class="strong">Python baseline</text>
<rect x="225" y="314" width="690" height="23" rx="7" fill="#16854f"/>
<text x="932" y="331" class="strong">151 / 151</text>
<text x="1057" y="331" class="pass">PASS</text>
<text x="73" y="374" class="strong">Rust</text>
<rect x="225" y="357" width="690" height="23" rx="7" fill="#e5eaf1"/>
<rect x="225" y="357" width="685" height="23" rx="7" fill="#16854f"/>
<rect x="909" y="357" width="6" height="23" rx="2" fill="#ca424b"/>
<text x="932" y="374" class="strong">150 / 151</text>
<text x="1057" y="374" class="fail">1 GAP</text>
<text x="73" y="418" class="strong">C</text>
<rect x="225" y="401" width="690" height="23" rx="7" fill="#e5eaf1"/>
<text x="932" y="418" class="pending">NOT RUN</text>
<text x="73" y="457" class="strong">Zig</text>
<rect x="225" y="440" width="690" height="23" rx="7" fill="#e5eaf1"/>
<text x="932" y="457" class="pending">NOT RUN</text>
<text x="56" y="528" class="heading">Every original Rust result is accounted for</text>
<rect x="54" y="544" width="1092" height="137" rx="12" fill="#ffffff" stroke="#dce5ef"/>
<text x="76" y="588" class="metric">150</text>
<text x="76" y="613" class="metric-label">passing original methods</text>
<text x="348" y="588" class="metric">0</text>
<text x="348" y="613" class="metric-label">test-harness errors</text>
<text x="600" y="588" class="metric">1</text>
<text x="600" y="613" class="metric-label">real missing _compile</text>
<text x="866" y="588" class="metric">1</text>
<text x="866" y="613" class="metric-label">debug-only skip</text>
<text x="75" y="650" class="small">150 passes + 0 harness errors + 1 real candidate error + 1 genuine debug-only skip = 152</text>
<text x="56" y="724" class="heading">What remains to fix</text>
<rect x="54" y="739" width="1092" height="91" rx="11" fill="#fff1f1" stroke="#ecc6c8"/>
<text x="72" y="769" class="body">Python’s pickling test needs the _compile helper. The from-scratch Rust engine does not expose it.</text>
<text x="72" y="798" class="small">This is a real remaining drop-in incompatibility, not a failed matching comparison.</text>
<text x="56" y="873" class="heading">The larger compatibility checks</text>
<text x="56" y="895" class="small">These broad checks are useful, but are not the original Python test suite shown above.</text>
<text x="66" y="932" class="strong">Rust</text>
<rect x="158" y="914" width="574" height="24" rx="7" fill="#16854f"/>
