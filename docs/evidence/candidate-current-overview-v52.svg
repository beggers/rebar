<title id="v52-title">Building a faster Python re: no compatible replacement yet; Rust native build passes; full compatibility is not yet proved</title>
<desc id="v52-description">The pinned Python 3.14.6 baseline was independently verified. The latest actual Rust replacement completed 13 workers, failed 928 compatibility checks and explicitly verified 8,965 passing observations; it is not compatible. The combined first-party buffer and match-serialization source belongs to the same Rust family. Its offline native build passed and recorded 28 successful compiler operations. The rebuilt candidate has not been matching-tested. There are six replacement families, one actually tested family and zero currently runnable or qualified replacements. Speed, memory and repair effectiveness are not measured. The 31,237 original checks, 50 signature checks, 32 public observations and 32 large-input observations are separate. The 4,194,304-case final comparison has not been generated or opened. Historical Rust, C and Zig failures are preserved. Two and only two genuine durable build-result owners raise actual current lower bounds from 179 and 184 to 181 and 186; the small Rust failure receipt proves no failure-category breakdown.</desc>
