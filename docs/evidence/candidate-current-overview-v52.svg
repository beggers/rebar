<text x="65" y="269" class="heading orange">Rust was tested and is not compatible</text>
<text x="67" y="298" class="body">13 real workers completed the frozen original comparison. Rust produced 928 differences and 8,965 explicitly verified passes.</text>
<text x="67" y="326" class="body">A successful evidence receipt means the failure was saved; it does not mean the replacement passed.</text>
<rect x="44" y="364" width="1352" height="108" rx="15" fill="#edf4ff" stroke="#bfd0ee"/>
