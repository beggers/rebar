<text x="67" y="427" class="body">The combined first-party Rust bridge was successfully built offline. Matching is NOT RUN; it is the same Rust family, not a seventh replacement.</text>
<text x="67" y="452" class="small">Repair effectiveness, compatibility, speed and memory: NOT MEASURED.</text>
