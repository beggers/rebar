<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1276" viewBox="0 0 1560 1276" role="img" aria-labelledby="title description">
<title id="title">Actual progress toward a faster Python re</title>
<desc id="description">Bars show confirmed correct original Python regular-expression checks, not speed. Python passes 31,237 out of 31,237, or 100 percent. C passes 16,262, or 52.1 percent; Rust passes 14,725, or 47.1 percent; Zig passes 4,607, or 14.7 percent. Thirteen real C workers attempted the original groups; 11 completed groups. All 606 current C11 examples are preserved in 21 recorded chunks. There are 10 source-canonical completed vectors and 1 transport-only public-surface vector with 114 records; source digest not provided by the original observer. Two incomplete original groups remain, with zero infrastructure failures and zero timeouts. An earlier C10 audit reported 92 recorded and 514 not recorded; those audit counts are not independently established by this graph and historical losses are not repaired. The speed, memory and runtime independence are not measured or not established. The proposed 14,155,776-case comparison is not frozen, not generated, and not opened. No fully compatible candidate and no winner.</desc>
<rect width="1560" height="1276" rx="24" fill="#0b1220"/>
<text x="48" y="66" fill="#f8fafc" font-size="32" font-family="system-ui,sans-serif" font-weight="740">Building a faster Python re, from scratch</text>
<text x="49" y="103" fill="#cbd5e1" font-size="17" font-family="system-ui,sans-serif">C improved; no fully compatible replacement; speed not measured; no winner</text>
<rect x="46" y="126" width="1468" height="82" rx="13" fill="#172338"/>
<text x="66" y="157" fill="#f8fafc" font-size="16" font-family="system-ui,sans-serif" font-weight="690">These bars show correctness against Python, not speed.</text>
<text x="66" y="185" fill="#cbd5e1" font-size="14" font-family="system-ui,sans-serif">Every bar uses the same 31,237 original checks. Failures, incomplete groups and unmeasured checks are never counted as passing.</text>
<text x="50" y="247" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif" font-weight="690">APPROACH</text>
<text x="159" y="247" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif" font-weight="690">ORIGINAL PYTHON CHECKS CONFIRMED</text>
<text x="730" y="247" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif" font-weight="690">WHAT THE ACTUAL RUN RECORDED</text>
<text x="1291" y="247" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif" font-weight="690">SPEED</text>
<text x="1510" y="247" text-anchor="end" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif" font-weight="690">RESULT</text>
