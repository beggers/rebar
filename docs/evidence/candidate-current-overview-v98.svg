<line x1="46" y1="757" x2="1514" y2="757" stroke="#334155"/>
<text x="51" y="789" fill="#f8fafc" font-size="17" font-family="system-ui,sans-serif" font-weight="700">What the new C run actually established</text>
<text x="51" y="819" fill="#cbd5e1" font-size="13" font-family="system-ui,sans-serif">13 real workers; 11 completed groups; all 606 current C11 examples preserved in 21 recorded chunks.</text>
<text x="51" y="847" fill="#cbd5e1" font-size="13" font-family="system-ui,sans-serif">10 source-canonical vectors; 1 transport-only public-surface vector; 114 records; source digest not provided by the original observer.</text>
<text x="51" y="875" fill="#cbd5e1" font-size="12" font-family="system-ui,sans-serif">Two incomplete original groups; zero infrastructure failures; zero timeouts. The complete overall failure total remains NOT MEASURED.</text>
<rect x="46" y="902" width="1468" height="104" rx="13" fill="#172338"/>
<text x="66" y="934" fill="#f8fafc" font-size="15" font-family="system-ui,sans-serif" font-weight="680">History stays honest</text>
<text x="66" y="961" fill="#cbd5e1" font-size="12" font-family="system-ui,sans-serif">Earlier C10 audit reported 92 recorded / 514 not recorded; not independently established by this graph.</text>
<text x="66" y="986" fill="#cbd5e1" font-size="12" font-family="system-ui,sans-serif">Historical losses not repaired. The new 606 recorded examples apply only to the new C11 run.</text>
<rect x="46" y="1026" width="1468" height="108" rx="13" fill="#172338"/>
<text x="66" y="1058" fill="#f8fafc" font-size="15" font-family="system-ui,sans-serif" font-weight="680">Future speed comparison: proposed 14,155,776 cases</text>
<text x="66" y="1086" fill="#cbd5e1" font-size="13" font-family="system-ui,sans-serif">NOT FROZEN; NOT GENERATED; NOT OPENED; NOT RUN. Speed, memory, confidence and rankings: NOT MEASURED.</text>
<text x="66" y="1111" fill="#cbd5e1" font-size="12" font-family="system-ui,sans-serif">The separate 8,244 reference checks are not added to the 31,237 original checks.</text>
<text x="51" y="1173" fill="#cbd5e1" font-size="12" font-family="system-ui,sans-serif">The C improvement is real. Compatibility, speed and a winner are not established.</text>
<text x="51" y="1204" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif">Overview 98; observed C11 failing records preserved; historical losses not repaired; no speed claims; no winner</text>
