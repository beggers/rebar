<text x="64" y="1228" class="heading">3. What did the new Rust build prove?</text>
<text x="66" y="1260" class="body">Its corrected Python adapter and C bridge were independently rebuilt in two private phases.</text>
<text x="66" y="1289" class="body">All 28 recorded build and inspection processes succeeded; both native roles reproduced.</text>
<text x="66" y="1318" class="body">The existing Rust native engine has the same observed bytes; no native-engine improvement is claimed.</text>
<text x="66" y="1347" class="body">The new Rust version ran 0 compatibility workers: its matching result is NOT MEASURED.</text>
<text x="66" y="1376" class="body">The last actually tested Rust still has 1,087 differences; tested C and Zig still have 1,230 and 2,172.</text>
<text x="66" y="1405" class="body">149 previous evidence files + one actual Rust build archive + one receipt = 151; 156 references.</text>
<text x="66" y="1434" class="body">No large C, Rust, or Zig matching failure archive is decompressed.</text>
<text x="66" y="1463" class="body">Speed, memory, confidence intervals, and undefined behavior are NOT MEASURED.</text>
<text x="66" y="1492" class="body">The 4,194,304-case final comparison has not been generated or opened.</text>
<text x="66" y="1521" class="body">No replacement is qualified, ranked, or selected as a winner.</text>
