<rect x="44" y="197" width="1352" height="552" rx="15" fill="#fff" stroke="#dae4ee"/>
<text x="64" y="232" class="heading">1. Which versions actually match Python?</text>
<text x="65" y="257" class="body">A successful build does not mean a matching test has run or that the new version is compatible.</text>
<rect x="63" y="273" width="1314" height="47" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="292" class="name">Python re — reference</text>
<text x="1358" y="292" class="pass" text-anchor="end">PASSED</text>
<text x="80" y="310" class="small">All 31,237 original reference checks pass.</text>
<rect x="63" y="326" width="1314" height="47" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="345" class="name">Rust — last fully tested version</text>
<text x="1358" y="345" class="fail" text-anchor="end">NOT COMPATIBLE</text>
<text x="80" y="363" class="small">13 completed original test groups; 1,087 differences; 7,438 verified passes.</text>
<rect x="63" y="379" width="1314" height="47" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="398" class="name">Rust — new corrected adapter and reproducible build</text>
<text x="1358" y="398" class="pending" text-anchor="end">BUILT; NOT YET TESTED</text>
<text x="80" y="416" class="small">Two private builds; 28 observed processes; 0 matching workers. Compatibility NOT MEASURED.</text>
<rect x="63" y="432" width="1314" height="47" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="451" class="name">C — fully tested current version</text>
<text x="1358" y="451" class="fail" text-anchor="end">NOT COMPATIBLE</text>
<text x="80" y="469" class="small">13 completed original test groups; 1,230 differences; 7,325 verified passes.</text>
<rect x="63" y="485" width="1314" height="47" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="504" class="name">C — fully tested earlier version</text>
<text x="1358" y="504" class="fail" text-anchor="end">NOT COMPATIBLE</text>
<text x="80" y="522" class="small">1,262 historical differences; the same 7,325 verified passes.</text>
<rect x="63" y="538" width="1314" height="47" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="557" class="name">Zig — fully tested current version</text>
<text x="1358" y="557" class="fail" text-anchor="end">NOT COMPATIBLE</text>
<text x="80" y="575" class="small">13 completed original test groups; 2,172 differences; 2,847 verified passes.</text>
<rect x="63" y="591" width="1314" height="47" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="610" class="name">Zig — earlier setup attempt</text>
<text x="1358" y="610" class="fail" text-anchor="end">SETUP STOPPED; 0 TESTS</text>
<text x="80" y="628" class="small">A separately preserved historical attempt started no matching workers.</text>
<rect x="63" y="644" width="1314" height="47" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="663" class="name">Speed, memory, and final ranking</text>
<text x="1358" y="663" class="pending" text-anchor="end">NOT MEASURED</text>
<text x="80" y="681" class="small">No compatible replacement, final speed comparison, confidence interval, or winner.</text>
<text x="65" y="727" class="body">Rust build success records an independently corrected Python adapter; it does not claim that the native engine changed or matching improved.</text>
<rect x="44" y="766" width="1352" height="410" rx="15" fill="#fff" stroke="#dae4ee"/>
<text x="64" y="802" class="heading">2. What did the previous C test show in each group?</text>
