<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title description">
<title id="title">How close are we to replacing Python’s re?</title>
<desc id="description">Three independently written Rust, C and Zig engines each passed all 223,198 original and 393 deeper correctness checks. 0 of 3 engines have passed all 152 original Python test methods, including 151 passes and one genuine debug-only skip. The first historical Rust harness failure remains preserved. Speed and memory are not measured.</desc>
