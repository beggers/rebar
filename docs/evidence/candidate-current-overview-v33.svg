<text x="1029" y="158" class="small">new Zig build processes</text>
<rect x="1214" y="98" width="184" height="82" rx="11" fill="#fff" stroke="#dae4ee"/>
<text x="1224" y="132" class="big">155 / 160</text>
<text x="1224" y="158" class="small">evidence / references</text>
<rect x="44" y="197" width="1352" height="630" rx="15" fill="#fff" stroke="#dae4ee"/>
<text x="64" y="232" class="heading">1. Which versions actually match Python?</text>
<text x="65" y="257" class="body">A passing source build never means that the new Zig candidate passed or even started a compatibility test.</text>
<rect x="63" y="273" width="1314" height="49" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="292" class="name">Python re — reference</text>
<text x="1358" y="292" class="pass" text-anchor="end">PASSED</text>
<text x="80" y="311" class="small">All 31,237 original Python reference checks pass.</text>
<rect x="63" y="328" width="1314" height="49" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="347" class="name">Rust — corrected and actually tested</text>
<text x="1358" y="347" class="fail" text-anchor="end">NOT COMPATIBLE</text>
<text x="80" y="366" class="small">13 matching workers; 1,036 differences; 8,965 verified passes.</text>
<rect x="63" y="383" width="1314" height="49" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="402" class="name">C — actually tested current version</text>
<text x="1358" y="402" class="fail" text-anchor="end">NOT COMPATIBLE</text>
<text x="80" y="421" class="small">13 matching workers; 1,230 differences; 7,325 verified passes.</text>
<rect x="63" y="438" width="1314" height="49" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="457" class="name">Zig — last actually tested version</text>
<text x="1358" y="457" class="fail" text-anchor="end">NOT COMPATIBLE</text>
<text x="80" y="476" class="small">13 matching workers; 2,172 differences; 2,847 verified passes.</text>
<rect x="63" y="493" width="1314" height="49" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="512" class="name">Zig — newly corrected, independently built twice</text>
<text x="1358" y="512" class="pending" text-anchor="end">BUILT; MATCHING NOT TESTED</text>
<text x="80" y="531" class="small">Two private source phases; 26 observed build processes; 0 new matching workers.</text>
<rect x="63" y="548" width="1314" height="49" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="567" class="name">Rust — previously tested historical version</text>
<text x="1358" y="567" class="fail" text-anchor="end">NOT COMPATIBLE</text>
<text x="80" y="586" class="small">Historical only: 1,087 differences and 7,438 verified passes.</text>
<rect x="63" y="603" width="1314" height="49" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="622" class="name">Additional Python signature checks</text>
<text x="1358" y="622" class="pending" text-anchor="end">REFERENCE NOT RUN</text>
<text x="80" y="641" class="small">50 frozen future checks; 0 reference executions; not added to the original denominator.</text>
<rect x="63" y="658" width="1314" height="49" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="677" class="name">Speed, memory, and final comparison</text>
<text x="1358" y="677" class="pending" text-anchor="end">NOT MEASURED</text>
<text x="80" y="696" class="small">No fully compatible replacement, speed comparison, confidence interval, or winner.</text>
<rect x="63" y="713" width="1314" height="49" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="732" class="name">Final hidden holdout</text>
<text x="1358" y="732" class="pending" text-anchor="end">NOT OPENED</text>
<text x="80" y="751" class="small">All 4,194,304 planned final comparison cases remain ungenerated and sealed.</text>
<text x="65" y="799" class="body">The corrected Zig build has no matching result; the 2,172 differences belong only to the earlier actually tested version.</text>
<rect x="44" y="845" width="1352" height="408" rx="15" fill="#fff" stroke="#dae4ee"/>
<text x="64" y="881" class="heading">2. What did the previously recorded C test show?</text>
<text x="65" y="905" class="body">These 13 recorded groups belong only to the historical C run with 1,262 differences.</text>
