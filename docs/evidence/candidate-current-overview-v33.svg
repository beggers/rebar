<text x="444" y="158" class="small">tested Rust differences</text>
<rect x="629" y="98" width="184" height="82" rx="11" fill="#fff" stroke="#dae4ee"/>
<text x="639" y="132" class="big">1,230</text>
<text x="639" y="158" class="small">tested C differences</text>
<rect x="824" y="98" width="184" height="82" rx="11" fill="#fff" stroke="#dae4ee"/>
