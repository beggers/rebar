<text x="64" y="1306" class="heading">3. What did the new Zig build actually prove?</text>
<text x="66" y="1338" class="body">Two separately owned source phases each built both first-party Zig native roles.</text>
<text x="66" y="1364" class="body">All 26 recorded offline compiler and inspection processes succeeded.</text>
<text x="66" y="1390" class="body">The engine and bridge were byte-identical across independently owned phase outputs.</text>
<text x="66" y="1416" class="body">The corrected Zig candidate ran 0 matching workers: compatibility remains NOT MEASURED.</text>
<text x="66" y="1442" class="body">The last actually tested Zig still has 2,172 differences and 2,847 verified passes.</text>
<text x="66" y="1468" class="body">Current actually tested Rust and C still have 1,036 and 1,230 differences.</text>
<text x="66" y="1494" class="body">153 previous evidence owners + one actual Zig build archive + one receipt = 155; 160 references.</text>
<text x="66" y="1520" class="body">All large Rust, C, and Zig matching-failure archives stay compressed.</text>
<text x="66" y="1546" class="body">The 50 separately frozen signature checks have not run against the Python reference.</text>
<text x="66" y="1572" class="body">Speed, memory, confidence intervals, and undefined behavior remain NOT MEASURED.</text>
<text x="66" y="1598" class="body">The 4,194,304-case final holdout is sealed; no replacement or winner is qualified.</text>
