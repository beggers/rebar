<text x="1224" y="164" class="small">evidence / references</text>
<rect x="44" y="205" width="1352" height="561" rx="15" fill="#fff" stroke="#dae4ee"/>
<text x="64" y="242" class="heading">1. Do the replacements match Python?</text>
<text x="65" y="266" class="body">All C, Rust, and Zig matching outcomes below come from actual completed 13-worker original tests.</text>
<rect x="63" y="283" width="1314" height="49" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="302" class="name">Python re — reference</text>
<text x="1358" y="302" class="pass" text-anchor="end">PASSED</text>
<text x="80" y="321" class="small">All 31,237 frozen original checks pass.</text>
<rect x="63" y="339" width="1314" height="49" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="358" class="name">C — newly rebuilt and actually tested</text>
<text x="1358" y="358" class="fail" text-anchor="end">NOT COMPATIBLE</text>
<text x="80" y="377" class="small">13 workers; 1,230 differences; 7,325 verified passes; 0 worker failures.</text>
<rect x="63" y="395" width="1314" height="49" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="414" class="name">C — previous actually tested version</text>
<text x="1358" y="414" class="fail" text-anchor="end">NOT COMPATIBLE</text>
<text x="80" y="433" class="small">13 workers; 1,262 differences; the same 7,325 verified passes.</text>
<rect x="63" y="451" width="1314" height="49" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="470" class="name">Rust — actually tested</text>
<text x="1358" y="470" class="fail" text-anchor="end">NOT COMPATIBLE</text>
<text x="80" y="489" class="small">13 workers; 1,087 differences; 7,438 verified passes; 0 worker failures.</text>
<rect x="63" y="507" width="1314" height="49" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="526" class="name">Zig — actually tested</text>
<text x="1358" y="526" class="fail" text-anchor="end">NOT COMPATIBLE</text>
<text x="80" y="545" class="small">13 workers; 2,172 differences; 2,847 verified passes; 0 worker failures.</text>
<rect x="63" y="563" width="1314" height="49" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="582" class="name">Zig — earlier setup attempt</text>
<text x="1358" y="582" class="fail" text-anchor="end">SETUP STOPPED; 0 TESTS</text>
<text x="80" y="601" class="small">A separate earlier failure started no matching workers.</text>
<rect x="63" y="619" width="1314" height="49" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="638" class="name">C — reproducible source build</text>
<text x="1358" y="638" class="pending" text-anchor="end">BUILD PASSED; MATCHING STILL FAILED</text>
<text x="80" y="657" class="small">Two real source builds; 14 real processes; byte-identical first-party binaries.</text>
<rect x="63" y="675" width="1314" height="49" rx="8" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="79" y="694" class="name">All final speed and memory comparisons</text>
<text x="1358" y="694" class="pending" text-anchor="end">NOT MEASURED</text>
<text x="80" y="713" class="small">No qualified replacement, fair speed comparison, ranking, or winner.</text>
<text x="65" y="750" class="body">The new C receipt contains totals, not individual test-group counts. Missing new group results are not invented.</text>
<rect x="44" y="783" width="1352" height="438" rx="15" fill="#fff" stroke="#dae4ee"/>
<text x="64" y="821" class="heading">2. What did the previous C test show in each group?</text>
<text x="65" y="845" class="body">These are the 13 recorded groups for the older C result of 1,262 differences, not the new 1,230-result run.</text>
