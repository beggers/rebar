<svg xmlns="http://www.w3.org/2000/svg" width="1510" height="1180" viewBox="0 0 1510 1180" role="img" aria-labelledby="title description">
<title id="title">Can our new engine replace Python re?</title>
<desc id="description">Correctness only, not speed. Both Python and Rust pass all 31,237 original checks and all 10,434 separate broader public checks. C passes 16,413 original checks with 606 observed differences and an unfinished group. Zig passes 4,607 original checks with at least 1,700 observed differences and unfinished groups. C++, Go, and Fortran have no complete measurement. Rust's static first-party audit passes with zero external regex engines, packages, or symbols. Live runtime independence is not established, no candidate is fully qualified, final speed is not measured, and no winner has been selected.</desc>
<rect width="1510" height="1180" rx="24" fill="#0b1220"/>
<text x="58" y="75" fill="#f8fafc" font-size="37" font-family="system-ui,sans-serif" font-weight="770">Can our new engine replace Python re?</text>
<text x="60" y="110" fill="#cbd5e1" font-size="19" font-family="system-ui,sans-serif">Two separate test sets check correctness. Neither bar measures speed.</text>
<rect x="56" y="140" width="1395" height="125" rx="16" fill="#122536" stroke="#326459"/>
<text x="80" y="180" fill="#6ee7b7" font-size="24" font-family="system-ui,sans-serif" font-weight="750">Rust now matches Python in both test sets</text>
<text x="82" y="219" fill="#f8fafc" font-size="20" font-family="system-ui,sans-serif" font-weight="660">31,237 / 31,237 original checks  +  10,434 / 10,434 broader checks</text>
<text x="82" y="246" fill="#cbd5e1" font-size="14" font-family="system-ui,sans-serif">Zero differences. More safety and independence checks are still required.</text>
