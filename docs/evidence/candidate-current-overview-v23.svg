<text x="1225" y="1192" class="body" text-anchor="end">768</text>
<text x="1562" y="1192" class="pass" text-anchor="end">PASSED</text>
<rect x="77" y="1206" width="1506" height="31" rx="5" fill="#f8fafd"/>
