<text x="1225" y="1262" class="body" text-anchor="end">2,854</text>
<text x="1562" y="1262" class="pass" text-anchor="end">PASSED</text>
<rect x="77" y="1276" width="1506" height="31" rx="5" fill="#f8fafd"/>
<text x="95" y="1297" class="body">Public types and serialization</text>
<text x="1225" y="1297" class="body" text-anchor="end">6,912</text>
<text x="1562" y="1297" class="fail" text-anchor="end">248 DIFFERENCES</text>
<rect x="77" y="1311" width="1506" height="31" rx="5" fill="#ffffff"/>
<text x="95" y="1332" class="body">Substitutions</text>
<text x="1225" y="1332" class="body" text-anchor="end">5,120</text>
<text x="1562" y="1332" class="fail" text-anchor="end">224 DIFFERENCES</text>
<rect x="77" y="1346" width="1506" height="31" rx="5" fill="#f8fafd"/>
<text x="95" y="1367" class="body">Result shapes</text>
<text x="1225" y="1367" class="body" text-anchor="end">10,240</text>
<text x="1562" y="1367" class="fail" text-anchor="end">672 DIFFERENCES</text>
<rect x="77" y="1381" width="1506" height="31" rx="5" fill="#ffffff"/>
<text x="95" y="1402" class="body">Full public interface</text>
<text x="1225" y="1402" class="body" text-anchor="end">1,376</text>
<text x="1562" y="1402" class="fail" text-anchor="end">114 DIFFERENCES</text>
<rect x="77" y="1416" width="1506" height="31" rx="5" fill="#f8fafd"/>
<text x="95" y="1437" class="body">Subinterpreters</text>
<text x="1225" y="1437" class="body" text-anchor="end">128</text>
<text x="1562" y="1437" class="pass" text-anchor="end">PASSED</text>
<rect x="77" y="1451" width="1506" height="31" rx="5" fill="#ffffff"/>
<text x="95" y="1472" class="body">Python buffer exporters</text>
<text x="1225" y="1472" class="body" text-anchor="end">264</text>
<text x="1562" y="1472" class="fail" text-anchor="end">4 DIFFERENCES</text>
<rect x="77" y="1486" width="1506" height="31" rx="5" fill="#f8fafd"/>
<text x="95" y="1507" class="body">Patterns across threads</text>
<text x="1225" y="1507" class="body" text-anchor="end">512</text>
<text x="1562" y="1507" class="pass" text-anchor="end">PASSED</text>
<text x="79" y="1550" class="body">Eight complete groups pass. The 7,325 passed checks count only those completely passing groups.</text>
<text x="79" y="1576" class="body">The remaining five groups contain 1,262 exact differences; no differences or failures were hidden.</text>
<rect x="54" y="1622" width="1552" height="193" rx="16" fill="#fff" stroke="#dae4ee"/>
<text x="77" y="1663" class="heading">3. Is any replacement faster?</text>
<text x="79" y="1695" class="body">NOT MEASURED. No candidate has first passed every correctness test.</text>
<text x="79" y="1725" class="body">There is no speed or memory comparison, confidence interval, ranking, winner, or opened final holdout.</text>
<text x="79" y="1755" class="body">Evidence: 105 earlier files + 30 new real worker and campaign files = 135 verified files; 140 signed references.</text>
<text x="79" y="1785" class="body">The original C binary, its exact inode, and its 0755 permissions were restored.</text>
<text x="58" y="1853" class="foot">Inputs SHA-256: e203be81e2ebafa23bd91e41902dd1949fa2245cb8d818e76444982021bfba68</text>
