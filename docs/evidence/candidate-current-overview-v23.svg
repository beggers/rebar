<text x="1225" y="1122" class="body" text-anchor="end">864</text>
<text x="1562" y="1122" class="pass" text-anchor="end">PASSED</text>
<rect x="77" y="1136" width="1506" height="31" rx="5" fill="#f8fafd"/>
<text x="95" y="1157" class="body">Scanning and callbacks</text>
<text x="1225" y="1157" class="body" text-anchor="end">1,024</text>
<text x="1562" y="1157" class="pass" text-anchor="end">PASSED</text>
<rect x="77" y="1171" width="1506" height="31" rx="5" fill="#ffffff"/>
