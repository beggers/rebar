<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1110" viewBox="0 0 1200 1110" role="img" aria-labelledby="title description">
<title id="title">How close are we to replacing Python’s re?</title>
<desc id="description">Three independently written Rust, C and Zig engines each passed all 223,198 original and 393 deeper correctness checks. The complete official Python suite has not passed: Rust stopped before its first test because of test-harness bridge wiring; C and Zig have not run it. Speed has not been measured.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.title{font-size:36px;font-weight:760;fill:#10223b}.subtitle{font-size:17px;fill:#43536b}.metric{font-size:31px;font-weight:750;fill:#10223b}.metric-label{font-size:15px;fill:#43536b}.heading{font-size:22px;font-weight:720;fill:#10223b}.body{font-size:16px;fill:#25364e}.small{font-size:14px;fill:#43536b}.strong{font-size:16px;font-weight:720;fill:#10223b}.pass{font-size:14px;font-weight:700;fill:#116139}.warning{font-size:14px;font-weight:720;fill:#8a4b08}.pending{font-size:14px;font-weight:720;fill:#485870}.footer{font-size:15px;font-weight:650;fill:#25364e}</style>
<rect width="1200" height="1110" rx="20" fill="#f5f8fc"/>
<text x="54" y="76" class="title">How close are we to replacing Python’s re?</text>
<text x="56" y="109" class="subtitle">Current from-scratch engines · checked against Python 3.14.6</text>
<rect x="54" y="143" width="240" height="100" rx="14" fill="#ffffff" stroke="#dce5ef"/>
<text x="71" y="184" class="metric">3</text>
<text x="71" y="215" class="metric-label">independently written engines</text>
<rect x="338" y="143" width="240" height="100" rx="14" fill="#ffffff" stroke="#dce5ef"/>
<text x="355" y="184" class="metric">669,594</text>
<text x="355" y="215" class="metric-label">original candidate-checks</text>
<rect x="622" y="143" width="240" height="100" rx="14" fill="#ffffff" stroke="#dce5ef"/>
<text x="639" y="184" class="metric">1,179</text>
<text x="639" y="215" class="metric-label">deeper candidate-checks</text>
<rect x="906" y="143" width="240" height="100" rx="14" fill="#ffffff" stroke="#dce5ef"/>
<text x="923" y="184" class="metric">0</text>
<text x="923" y="215" class="metric-label">observed correctness mismatches</text>
<text x="56" y="288" class="heading">Original correctness checks</text>
<text x="56" y="313" class="small">The same 223,198 cases for each engine · 49 categories</text>
<text x="66" y="367" class="strong">Rust</text>
<rect x="158" y="345" width="700" height="29" rx="8" fill="#d9efe4"/>
<rect x="158" y="345" width="700" height="29" rx="8" fill="#17844e"/>
<text x="875" y="365" class="strong">223,198 / 223,198</text>
<text x="1080" y="365" class="pass">100%</text>
<text x="66" y="421" class="strong">C</text>
<rect x="158" y="399" width="700" height="29" rx="8" fill="#d9efe4"/>
<rect x="158" y="399" width="700" height="29" rx="8" fill="#17844e"/>
<text x="875" y="419" class="strong">223,198 / 223,198</text>
<text x="1080" y="419" class="pass">100%</text>
<text x="66" y="475" class="strong">Zig</text>
<rect x="158" y="453" width="700" height="29" rx="8" fill="#d9efe4"/>
<rect x="158" y="453" width="700" height="29" rx="8" fill="#17844e"/>
<text x="875" y="473" class="strong">223,198 / 223,198</text>
<text x="1080" y="473" class="pass">100%</text>
<text x="56" y="557" class="heading">Deeper correctness checks</text>
<text x="56" y="582" class="small">The same 393 difficult cases for each engine · including 64 fixed-seed cases</text>
<text x="66" y="633" class="strong">Rust</text>
<rect x="158" y="611" width="700" height="29" rx="8" fill="#d9efe4"/>
<rect x="158" y="611" width="700" height="29" rx="8" fill="#17844e"/>
<text x="875" y="631" class="strong">393 / 393</text>
<text x="1080" y="631" class="pass">100%</text>
<text x="66" y="687" class="strong">C</text>
<rect x="158" y="665" width="700" height="29" rx="8" fill="#d9efe4"/>
<rect x="158" y="665" width="700" height="29" rx="8" fill="#17844e"/>
<text x="875" y="685" class="strong">393 / 393</text>
<text x="1080" y="685" class="pass">100%</text>
<text x="66" y="741" class="strong">Zig</text>
<rect x="158" y="719" width="700" height="29" rx="8" fill="#d9efe4"/>
<rect x="158" y="719" width="700" height="29" rx="8" fill="#17844e"/>
<text x="875" y="739" class="strong">393 / 393</text>
<text x="1080" y="739" class="pass">100%</text>
<text x="56" y="820" class="heading">Complete Python test suite</text>
<text x="56" y="844" class="small">Passing these 152 original tests is still required before claiming a drop-in replacement.</text>
<rect x="54" y="862" width="326" height="121" rx="13" fill="#fff8eb" stroke="#f2d199"/>
<text x="71" y="892" class="strong">Rust</text>
<text x="71" y="918" class="warning">STOPPED BEFORE TESTS</text>
<text x="71" y="945" class="body">0 / 152 reached</text>
<text x="71" y="969" class="small">Test-harness bridge wiring</text>
<rect x="437" y="862" width="326" height="121" rx="13" fill="#f1f4f9" stroke="#d9e1ec"/>
<text x="454" y="892" class="strong">C</text>
<text x="454" y="918" class="pending">NOT RUN</text>
<text x="454" y="945" class="body">152 tests remain</text>
<text x="454" y="969" class="small">No result claimed</text>
<rect x="820" y="862" width="326" height="121" rx="13" fill="#f1f4f9" stroke="#d9e1ec"/>
<text x="837" y="892" class="strong">Zig</text>
<text x="837" y="918" class="pending">NOT RUN</text>
<text x="837" y="945" class="body">152 tests remain</text>
<text x="837" y="969" class="small">No result claimed</text>
<rect x="54" y="1002" width="1092" height="73" rx="12" fill="#ffffff" stroke="#dce5ef"/>
<text x="72" y="1030" class="footer">Overall: promising correctness; complete compatibility NOT ESTABLISHED.</text>
<text x="72" y="1054" class="small">Speed and memory: NOT MEASURED · final holdout: NOT ACCESSED.</text>
</svg>
