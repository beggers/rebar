<text x="62" y="283" fill="#f8fafc" font-size="16" font-family="system-ui,sans-serif" font-weight="650">Zig</text>
<text x="175" y="283" fill="#cbd5e1" font-size="14" font-family="system-ui,sans-serif">1,764 earlier differences; scanner fix not retested</text>
<text x="1108" y="283" text-anchor="end" fill="#f59e0b" font-size="13" font-family="system-ui,sans-serif" font-weight="700">NOT COMPATIBLE</text>
<circle cx="43" cy="325" r="6" fill="#fb7185"/>
<text x="62" y="330" fill="#f8fafc" font-size="16" font-family="system-ui,sans-serif" font-weight="650">C++</text>
<text x="175" y="330" fill="#cbd5e1" font-size="14" font-family="system-ui,sans-serif">2,308 differences; five worker failures</text>
<text x="1108" y="330" text-anchor="end" fill="#fb7185" font-size="13" font-family="system-ui,sans-serif" font-weight="700">NOT COMPATIBLE</text>
<circle cx="43" cy="372" r="6" fill="#fb7185"/>
