<text x="62" y="236" fill="#f8fafc" font-size="16" font-family="system-ui,sans-serif" font-weight="650">C</text>
<text x="175" y="236" fill="#cbd5e1" font-size="14" font-family="system-ui,sans-serif">1,230 earlier differences; corrected build passes</text>
<text x="1108" y="236" text-anchor="end" fill="#f59e0b" font-size="13" font-family="system-ui,sans-serif" font-weight="700">NOT COMPATIBLE</text>
