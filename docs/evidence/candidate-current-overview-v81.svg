<text x="62" y="189" fill="#f8fafc" font-size="16" font-family="system-ui,sans-serif" font-weight="650">Rust</text>
<text x="175" y="189" fill="#cbd5e1" font-size="14" font-family="system-ui,sans-serif">Two retests each had 13 startup failures; diagnostics fix ready</text>
<text x="1108" y="189" text-anchor="end" fill="#f59e0b" font-size="13" font-family="system-ui,sans-serif" font-weight="700">NOT RETESTED</text>
