<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1120" viewBox="0 0 1520 1120" role="img" aria-labelledby="title description">
<title id="title">How close are from-scratch alternatives to Python re?</title>
<desc id="description">Bars show confirmed matching checks, never speed. Python passes 31,237 of 31,237 original checks. Rust verifies 14,725 and retains its prior real regression. C verifies 13,606, with an observed lower bound of 606 differences, five mismatch groups, and five unfinished candidate workers; there were zero infrastructure failures. Individual mismatch-vector completeness is not measured. Zig retains its previous 4,607 verified checks, its 13 warning-bearing workers, and at least 1,700 differences. Its newer corrected controller failed before publishing any matching result, so no corrected checks, workers, or eliminated warnings are claimed. C++, Go, and Fortran have no fully measured original result. The 8,244 separate reference checks are excluded from the 31,237 denominator. The proposed 14,155,776-case speed test is not frozen, not generated, and not opened. Speed, memory, safety, and rankings are not measured. No winner.</desc>
<rect width="1520" height="1120" rx="24" fill="#0b1220"/>
<text x="48" y="66" fill="#f8fafc" font-size="32" font-family="system-ui,sans-serif" font-weight="740">Building a faster Python re, from scratch</text>
<text x="49" y="104" fill="#cbd5e1" font-size="17" font-family="system-ui,sans-serif">Six independently written approaches; no fully compatible replacement; no speed result; no winner</text>
<rect x="46" y="127" width="1428" height="78" rx="13" fill="#172338"/>
<text x="65" y="158" fill="#f8fafc" font-size="16" font-family="system-ui,sans-serif" font-weight="690">The bars show compatibility with Python, not speed.</text>
<text x="65" y="184" fill="#cbd5e1" font-size="14" font-family="system-ui,sans-serif">All bars use the same 31,237 original checks. Failed, unfinished, and unmeasured checks never count as passes.</text>
<text x="50" y="244" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif" font-weight="690">APPROACH</text>
<text x="161" y="244" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif" font-weight="690">ORIGINAL PYTHON CHECKS CONFIRMED</text>
<text x="724" y="244" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif" font-weight="690">WHAT THE TESTS SHOW</text>
<text x="1260" y="244" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif" font-weight="690">SPEED</text>
<text x="1470" y="244" text-anchor="end" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif" font-weight="690">RESULT</text>
