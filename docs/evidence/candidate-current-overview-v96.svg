<line x1="46" y1="757" x2="1474" y2="757" stroke="#334155"/>
<text x="51" y="790" fill="#f8fafc" font-size="17" font-family="system-ui,sans-serif" font-weight="700">What did the newest real experiments show?</text>
<text x="51" y="817" fill="#cbd5e1" font-size="13" font-family="system-ui,sans-serif">C still confirms 13,606 checks. The observed difference lower bound increased from 492 to 606. Five candidate workers did not finish; zero were infrastructure failures.</text>
<text x="51" y="846" fill="#cbd5e1" font-size="13" font-family="system-ui,sans-serif">The corrected Zig controller stopped before a matching result could be published. Its corrected matching and cleanup are NOT MEASURED.</text>
<text x="51" y="875" fill="#cbd5e1" font-size="13" font-family="system-ui,sans-serif">The previous real Rust regression, all 13 previous Zig warning-bearing workers, and every earlier result remain preserved.</text>
<rect x="46" y="899" width="1428" height="120" rx="13" fill="#172338"/>
<text x="66" y="932" fill="#f8fafc" font-size="16" font-family="system-ui,sans-serif" font-weight="680">Future speed comparison: proposed 14,155,776 cases</text>
<text x="66" y="959" fill="#cbd5e1" font-size="13" font-family="system-ui,sans-serif">NOT FROZEN; NOT GENERATED; NOT OPENED; NOT RUN. Speed, memory, confidence, and rankings: NOT MEASURED.</text>
<text x="66" y="986" fill="#cbd5e1" font-size="12" font-family="system-ui,sans-serif">The separate 8,244 reference checks are not added to the 31,237 original checks.</text>
<text x="51" y="1065" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif">Overview 96; all observed losses preserved; no corrected Zig matching invented; no speed claims; no winner</text>
</svg>
