<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530" role="img" aria-labelledby="lifetime-title lifetime-desc">
<title id="lifetime-title">Memory and buffer safety compared with Python</title>
<desc id="lifetime-desc">Python, Rust, C, and Zig are shown against the same separate 1,024 Python memory and buffer safety checks. Green matches Python; red does not; gray has not yet been measured. No speed or hidden benchmark is included.</desc>
