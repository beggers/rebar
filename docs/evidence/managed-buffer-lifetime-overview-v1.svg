<text x="42" y="82" fill="#475569" font-family="system-ui,sans-serif" font-size="15">Same 1,024 extra Python checks for every engine · speed not measured</text>
<rect x="43" y="104" width="14" height="14" rx="3" fill="#15803d"/><text x="65" y="116" fill="#334155" font-family="system-ui,sans-serif" font-size="13">Matches Python</text>
<rect x="275" y="104" width="14" height="14" rx="3" fill="#dc2626"/><text x="297" y="116" fill="#334155" font-family="system-ui,sans-serif" font-size="13">Does not match Python</text>
<rect x="507" y="104" width="14" height="14" rx="3" fill="#94a3b8"/><text x="529" y="116" fill="#334155" font-family="system-ui,sans-serif" font-size="13">Not yet measured</text>
