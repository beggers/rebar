<text x="82" y="912" fill="#93c5fd" font-size="18" font-family="system-ui,sans-serif" font-weight="730">What changed — and what did not</text>
<text x="82" y="945" fill="#e2e8f0" font-size="14" font-family="system-ui,sans-serif">Capture-clamp bridge changed; the engine stayed the same.</text>
<text x="82" y="974" fill="#e2e8f0" font-size="14" font-family="system-ui,sans-serif">13 of 13 groups ran; 11 passed; 13 workers were distinct.</text>
