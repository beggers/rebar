<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1215" viewBox="0 0 1480 1215" role="img" aria-labelledby="title description">
<title id="title">Candidate correctness: Rust safety changed, compatibility did not</title>
<desc id="description">Original public correctness, not speed: Python passes 31,237 of 31,237 checks, C verifies 16,413, Rust verifies 15,877, and Zig verifies 4,607. C++, Go, and Fortran remain unmeasured. Rust V25 changed its native capture-clamp bridge but improved zero compatibility checks over Rust V24: the same 1,352 semantic losses remain, 240 substitution and 1,112 shape. All 13 groups completed in 13 distinct workers and 11 groups passed. A separate non-delegation audit failed with one latent private candidate-owned import-chain finding; actual public matching delegation was not proven. No candidate qualifies. Speed and final memory are not measured. The proposed 141,557,760-case final comparison is not frozen, generated, or opened.</desc>
