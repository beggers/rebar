<line x1="34" y1="462" x2="1086" y2="462" stroke="#334155"/>
<text x="34" y="493" fill="#f8fafc" font-size="15" font-family="system-ui,sans-serif" font-weight="650">31,237 original Python checks; 8,244 separate extra checks.</text>
