<text x="62" y="424" fill="#f8fafc" font-size="16" font-family="system-ui,sans-serif" font-weight="650">Fortran</text>
<text x="175" y="424" fill="#cbd5e1" font-size="14" font-family="system-ui,sans-serif">Full Python compatibility has not been tested</text>
