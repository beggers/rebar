<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1630" viewBox="0 0 1600 1630" role="img" aria-labelledby="v19-title v19-description">
<title id="v19-title">Which from-scratch engines actually match Python re?</title>
<desc id="v19-description">Python passes its original 31,237 checks. No six replacement candidates is fully compatible. The complete, memory-bounded Go campaign passed 128 checks and recorded 4518 actual matching differences; 4 distinct failures were infrastructure rather than semantic mismatches. C++ passed 128 checks with 2,308 actual mismatches and five infrastructure failures. Its previous Go reporting failure also remains preserved. All 71 repository evidence files are preserved. Speed, memory, and confidence remain unmeasured; the proposed 4,194,304-case holdout remains ungenerated and unopened.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:35px;font-weight:760;fill:#16324f}.heading{font-size:25px;font-weight:740;fill:#16324f}.body{font-size:15px;fill:#42556c}.name{font-size:18px;font-weight:720;fill:#16324f}.pass{font-size:15px;font-weight:750;fill:#00794c}.fail{font-size:15px;font-weight:740;fill:#a15e00}.warning{font-size:15px;font-weight:740;fill:#725400}.pending{font-size:15px;font-weight:700;fill:#58697d}.big{font-size:31px;font-weight:760;fill:#16324f}.foot{font-size:12px;fill:#53667b}</style>
<rect width="1600" height="1630" rx="22" fill="#f4f7fb"/>
<text x="54" y="69" class="title">Can these engines replace Python re?</text>
<text x="56" y="100" class="body">Python 3.14.6 · first-party engines · every original failure preserved</text>
<rect x="54" y="124" width="367" height="102" rx="13" fill="#fff" stroke="#dae4ee"/>
<text x="69" y="167" class="big">31,237</text>
<text x="69" y="201" class="body">original compatibility checks</text>
<rect x="440" y="124" width="367" height="102" rx="13" fill="#fff" stroke="#dae4ee"/>
<text x="455" y="167" class="big">0 of 6</text>
<text x="455" y="201" class="body">fully compatible replacements</text>
<rect x="826" y="124" width="367" height="102" rx="13" fill="#fff" stroke="#dae4ee"/>
<text x="841" y="167" class="big">71</text>
<text x="841" y="201" class="body">verified repository evidence files</text>
<rect x="1212" y="124" width="367" height="102" rx="13" fill="#fff" stroke="#dae4ee"/>
<text x="1227" y="167" class="big">NOT MEASURED</text>
<text x="1227" y="201" class="body">speed, memory and confidence</text>
<rect x="54" y="245" width="1490" height="806" rx="16" fill="#fff" stroke="#dae4ee"/>
<text x="75" y="287" class="heading">1. Does it match Python?</text>
<text x="77" y="315" class="body">All comparisons use the same original 13 groups and 31,237-case Python baseline.</text>
<rect x="75" y="342" width="1448" height="72" rx="9" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="94" y="370" class="name">Python re</text>
<text x="1500" y="370" class="pass" text-anchor="end">31,237 / 31,237</text>
<text x="272" y="396" class="body">All original Python reference checks passed</text>
<rect x="75" y="425" width="1448" height="72" rx="9" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="94" y="453" class="name">Rust</text>
<text x="1500" y="453" class="fail" text-anchor="end">FAILED; NOT QUALIFIED</text>
<text x="272" y="479" class="body">7,461 verified passes; 2,042 genuine matching differences</text>
<rect x="75" y="508" width="1448" height="72" rx="9" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="94" y="536" class="name">C</text>
<text x="1500" y="536" class="fail" text-anchor="end">FAILED; NOT QUALIFIED</text>
<text x="272" y="562" class="body">7,197 verified passes; 2,094 genuine matching differences</text>
<rect x="75" y="591" width="1448" height="72" rx="9" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="94" y="619" class="name">Zig</text>
<text x="1500" y="619" class="fail" text-anchor="end">FAILED; NOT QUALIFIED</text>
<text x="272" y="645" class="body">3,583 verified passes; 1,764 genuine matching differences</text>
<rect x="75" y="674" width="1448" height="72" rx="9" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="94" y="702" class="name">C++</text>
<text x="1500" y="702" class="fail" text-anchor="end">FAILED; NOT QUALIFIED</text>
<text x="272" y="728" class="body">128 verified passes; 2,308 matching differences; five distinct infrastructure failures</text>
<rect x="75" y="757" width="1448" height="72" rx="9" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="94" y="785" class="name">Go</text>
<text x="1500" y="785" class="fail" text-anchor="end">FAILED; NOT QUALIFIED</text>
<text x="272" y="811" class="body">128 verified passes; 4,518 matching differences; 4 infrastructure failures</text>
<rect x="75" y="840" width="1448" height="72" rx="9" fill="#f8fafd" stroke="#e5ecf2"/>
<text x="94" y="868" class="name">Fortran</text>
<text x="1500" y="868" class="warning" text-anchor="end">BUILD NOT REPRODUCIBLE</text>
<text x="272" y="894" class="body">Compiled engines differ; matching remains NOT MEASURED</text>
<text x="79" y="970" class="body">The earlier Go report-size failure is preserved separately; the corrected full result is now recorded.</text>
<text x="79" y="998" class="body">C++ and Go both restored their original native files; no candidate is currently active.</text>
<rect x="54" y="1070" width="1490" height="412" rx="16" fill="#fff" stroke="#dae4ee"/>
<text x="76" y="1110" class="heading">2. Is any replacement faster?</text>
<text x="78" y="1136" class="body">NOT MEASURED. No speed bars, confidence intervals, rankings, or memory results exist.</text>
<text x="93" y="1172" class="name">Python re</text>
<text x="1500" y="1172" class="pending" text-anchor="end">REFERENCE ONLY; NOT TIMED</text>
<text x="93" y="1206" class="name">Rust</text>
<text x="1500" y="1206" class="pending" text-anchor="end">NOT MEASURED</text>
<text x="93" y="1240" class="name">C</text>
<text x="1500" y="1240" class="pending" text-anchor="end">NOT MEASURED</text>
<text x="93" y="1274" class="name">Zig</text>
<text x="1500" y="1274" class="pending" text-anchor="end">NOT MEASURED</text>
<text x="93" y="1308" class="name">C++</text>
<text x="1500" y="1308" class="pending" text-anchor="end">NOT MEASURED</text>
<text x="93" y="1342" class="name">Go</text>
<text x="1500" y="1342" class="pending" text-anchor="end">NOT MEASURED</text>
<text x="93" y="1376" class="name">Fortran</text>
<text x="1500" y="1376" class="pending" text-anchor="end">NOT MEASURED</text>
<text x="80" y="1430" class="body">A 1.5× speedup is a future goal, not an observed result.</text>
<text x="58" y="1505" class="body">Proposed 4,194,304-case holdout: NOT GENERATED; NOT OPENED.</text>
<text x="58" y="1540" class="foot">Inputs SHA-256: 8f1eb51ff477f0b59934ee503d9bf795f472fd6674180e2af244c7ad4504560c</text>
