<text x="1126" y="243" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif" font-weight="690">SPEED VS PYTHON</text>
<text x="1393" y="243" text-anchor="end" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif" font-weight="690">RESULT</text>
