<text x="63" y="949" fill="#cbd5e1" font-size="12" font-family="system-ui,sans-serif">The separate 8,244 reference checks are not added to the 31,237 original checks. All previous results remain preserved.</text>
<text x="49" y="1001" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif">Overview 94 · original test results only · no full replacement · no speed claim · no winner</text>
