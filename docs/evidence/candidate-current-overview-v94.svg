<line x1="44" y1="747" x2="1396" y2="747" stroke="#334155"/>
<text x="49" y="779" fill="#f8fafc" font-size="17" font-family="system-ui,sans-serif" font-weight="690">Why Zig is not a drop-in replacement yet</text>
<text x="49" y="805" fill="#cbd5e1" font-size="13" font-family="system-ui,sans-serif">At least 1,700 real differences; all 13 test workers emitted cleanup warnings; at least 143 examples are visible in the saved excerpts.</text>
<text x="49" y="829" fill="#cbd5e1" font-size="13" font-family="system-ui,sans-serif">Twelve warning excerpts are truncated, so the full warning count is NOT MEASURED. One child-interpreter test remains incomplete.</text>
<text x="49" y="853" fill="#cbd5e1" font-size="13" font-family="system-ui,sans-serif">The failed child test created zero confirmed child interpreters and installed zero confirmed child guards.</text>
<rect x="44" y="871" width="1352" height="104" rx="13" fill="#172338"/>
<text x="63" y="900" fill="#f8fafc" font-size="16" font-family="system-ui,sans-serif" font-weight="680">Future speed comparison: proposed 14,155,776 cases</text>
