<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-labelledby="title description">
<title id="title">How close are from-scratch alternatives to Python re?</title>
<desc id="description">The bars show correctness, not speed. The standard Python baseline passes all 31,237 original checks. Rust has 15,749 verified passing checks; C has 13,606; Zig has 4,607. None is fully compatible. C++, Go, and Fortran do not have a measured complete current matching result. All thirteen actual Zig workers emitted cleanup warnings, with at least 143 warning examples captured in their excerpts; twelve excerpts are truncated, so the complete warning count is not measured. Zig has at least 1,700 actual mismatches and one genuine unfinished child-interpreter test with zero successfully created child interpreters or child guards. Speed and memory are not measured. The separate 8,244 checks are not added to the original denominator. The proposed 14,155,776-case speed comparison is not frozen, generated, opened, or run. There is no winner.</desc>
<rect width="1440" height="1020" rx="24" fill="#0b1220"/>
<text x="46" y="65" fill="#f8fafc" font-size="32" font-family="system-ui,sans-serif" font-weight="740">Building a faster Python re, from scratch</text>
<text x="47" y="103" fill="#cbd5e1" font-size="17" font-family="system-ui,sans-serif">Six independent approaches · no fully compatible replacement · no winner</text>
<rect x="44" y="125" width="1352" height="78" rx="13" fill="#172338"/>
<text x="63" y="155" fill="#f8fafc" font-size="16" font-family="system-ui,sans-serif" font-weight="690">These bars show matching correctness, not speed.</text>
<text x="63" y="181" fill="#cbd5e1" font-size="14" font-family="system-ui,sans-serif">Each result uses the same 31,237 original Python checks. An unfinished or unmeasured check is never counted as a pass.</text>
