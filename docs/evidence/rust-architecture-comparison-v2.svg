<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1412" viewBox="0 0 1280 1412" role="img" aria-labelledby="title description">
<title id="title">Rust architecture comparison: search, compiler, and combined public results</title>
<desc id="description">Python baseline 1.0x; original Rust 0.8649792983684755x; V26 required-character search 1.2520878685068846x, confidence interval 1.1990748170405823 to 1.3083112791522158; V27 compiler 0.7967512788167544x, interval 0.7477430408484538 to 0.8453719226231972; V28 combined 1.2298384265743338x, interval 1.1780942933805956 to 1.2849593897495446. All three optimized designs remain unqualified: each fails the full 10,434-case public gate with 1,145 mismatches. V26 has 247 faster cases and 11 major regressions; V27 has 138 faster and 143 regressions; V28 has 208 faster and eight regressions. Frozen original-suite mismatches remain 1,352; final speed is not measured and no winner was selected.</desc>
