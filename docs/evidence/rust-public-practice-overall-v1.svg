<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1135" viewBox="0 0 1480 1135" role="img" aria-labelledby="title description">
<title id="title">Public practice only: Rust is slower overall; profiling was incomplete</title>
<desc id="description">This is public practice only, never a final benchmark or holdout. All 416 fresh public correctness cases matched CPython. Across 1,664 paired observations Rust geometric speedup is 0.8485646292880136 times and total-time speedup is 0.5958109767071408 times. Rust was faster in 723 pairs and slower in 937. Dense same-letter no-match workloads are 0.41613883193210616 times as fast; six other public cohorts each have geometric speedup above one. Gprofng printed a banner before valid standard-library JSON, so profiling failed before Rust collection. Final speed, confidence, native memory, qualification, and a winner remain not measured.</desc>
