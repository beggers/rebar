<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1100" viewBox="0 0 1480 1100" role="img" aria-labelledby="title description">
<title id="title">Public practice only: Rust is slower overall despite six faster cohorts</title>
<desc id="description">Public practice only, not final benchmarking. All 416 public Rust correctness cases match Python. Across 1,664 paired public timings, aggregate Python-over-Rust speed is 0.595803047189324 times, equal-case geometric speed is 0.8649792983684755 times, and equal-pair geometric speed is 0.8608014813128971 times. Rust wins 222 of 416 cases and 807 of 1,664 individual pairs. Dense same-letter no-match workloads are 0.21409330078969788 times as fast in aggregate and 0.42168362785 times as fast by equal case; the other six cohorts combined are 1.26812071029 times as fast. Of 73 cases over twenty percent slower, 69 are dense. Native CPU per-function profiling and confidence intervals are not measured: both profiler timers failed and the supposed CPU report is leaked bytes. The final holdout remains unopened, no candidate qualifies, and no winner is selected.</desc>
